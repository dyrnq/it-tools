{#
  Ctrl/Cmd+K 命令面板。
  条目数据来自 base.nav.search，服务端渲染空壳，app.js 负责过滤与键盘导航。
#}
<div class="palette" id="palette" hidden>
  <div class="palette-panel" role="dialog" aria-modal="true" aria-label="{{ base.ui.search }}">
    <div class="palette-input-row">
      {{<icon icon_name="search" size="20" cls="palette-search-icon" />}}
      <input class="palette-input" id="palette-input" type="text" autocomplete="off"
             placeholder="{{ base.ui.search_placeholder }}" aria-label="{{ base.ui.search }}">
    </div>
    <div class="palette-results" id="palette-results" role="listbox"></div>
    <div class="palette-empty" id="palette-empty" hidden>{{ base.ui.no_results }}</div>
    <div class="palette-foot">
      <span><kbd>↑</kbd><kbd>↓</kbd> {{ base.ui.tools }}</span>
      <span><kbd>Enter</kbd> {{ base.ui.run }}</span>
      <span><kbd>Esc</kbd></span>
    </div>
  </div>
</div>

<script id="palette-data" type="application/json">
{{ base.nav.search | json_encode | safe }}
</script>
<script id="palette-i18n" type="application/json">
{{ base.palette_i18n | json_encode | safe }}
</script>
