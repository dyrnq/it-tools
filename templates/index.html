{% extends "base.html" %}

{% block content %}
<div class="home">

  {# 1. 我的收藏 —— 内容由 app.js 从 localStorage 渲染 #}
  <div id="favorites-section" hidden>
    {{<section_head title={base.ui.favorites} drag_hint={base.ui.drag_hint} note="true" />}}
    <div class="grid grid-tools" id="favorites-grid" data-drag="true"></div>
  </div>

  {# 2. 全部工具 #}
  {{<section_head title={base.ui.all_tools} drag_hint={base.ui.drag_hint} />}}
  <div class="grid grid-tools">
    {% for cat in base.nav.categories %}
      {% for tool in cat.tools %}{{<tool_card card={tool} new_badge={base.ui.new_badge} fav_label={base.ui.add_favorite} />}}{% endfor %}
    {% endfor %}
  </div>
</div>
{% endblock content %}
