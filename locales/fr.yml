# fr 语言包。
#
# 英文从 `locales/en.yml` 来，这个文件是同结构的其他语言。
# 键没译到的会**逐条**回退到英文（见 src/i18n.rs 的 t()），
# 所以这个文件可以只写一部分 —— 缺的那条显示英文，不会露出键名。
#
# 由 scripts/i18n/merge.py 从 new-tool/i18n/fr/ 下的翻译片段合并而成。
#

tools:
  argon2-hash-generator:
    description: 'Hachez et comparez des chaînes avec Argon2 (argon2id, argon2i ou argon2d), avec une taille de mémoire, un nombre d''itérations, un parallélisme et une longueur de hash configurables. Argon2 a remporté le Password Hashing Competition et reste la recommandation actuelle pour stocker les mots de passe.'
    title: 'Générateur de hash Argon2'
  ascii-text-drawer:
    description: 'Dessinez un mot ou quelques lignes de texte en art ASCII.'
    title: 'Dessinateur de texte ASCII'
  base-converter:
    description: 'Convertissez un nombre entre différentes bases (décimal, hexadécimal, binaire, octal, base64, ...)'
    title: 'Convertisseur de bases entières'
  base64-file-converter:
    description: 'Convertissez une chaîne, un fichier ou une image en sa représentation base64.'
    title: 'Convertisseur de fichiers Base64'
  base64-string-converter:
    description: 'Encodez et décodez simplement des chaînes en leur représentation Base64.'
    title: 'Encodeur/décodeur de chaînes Base64'
  basic-auth-generator:
    description: 'Génère un en-tête d''authentification Basic en base64 à partir d''un nom d''utilisateur et d''un mot de passe.'
    title: 'Générateur d''authentification Basic'
  bcrypt:
    description: 'Hachez et comparez des chaînes avec bcrypt. Bcrypt est une fonction de hachage de mot de passe basée sur le chiffrement Blowfish.'
    title: 'Bcrypt'
  benchmark-builder:
    description: 'Comparez facilement le temps d''exécution de tâches avec ce générateur de benchmark en ligne très simple.'
    title: 'Générateur de benchmark'
  bip39-generator:
    description: 'Générez une phrase secrète BIP39 à partir d''une phrase mnémonique existante ou aléatoire, ou obtenez la phrase mnémonique à partir de la phrase secrète.'
    title: 'Générateur de phrase secrète BIP39'
  camera-recorder:
    description: 'Prenez une photo ou enregistrez une vidéo depuis votre webcam ou caméra.'
    title: 'Enregistreur de caméra'
  case-converter:
    description: 'Transformez la casse d''une chaîne et choisissez parmi différents formats.'
    title: 'Convertisseur de casse'
  categories:
    converter: 'Conversion'
    crypto: 'Cryptographie'
    data: 'Données'
    development: 'Développement'
    'images and videos': 'Images et vidéos'
    math: 'Mathématiques'
    measurement: 'Mesure'
    network: 'Réseau'
    text: 'Texte'
    web: 'Web'
  chinese-number-converter:
    description: 'Convertissez les chiffres chinois en chiffres arabes et inversement. Prend en charge les chiffres financiers en majuscules (壹贰叁), les chiffres ordinaires, les montants en RMB et les variantes de caractères traditionnelles.'
    title: 'Convertisseur de chiffres chinois'
  chmod-calculator:
    description: 'Calculez vos permissions et vos commandes chmod avec ce calculateur chmod en ligne.'
    title: 'Calculateur chmod'
  chronometer:
    description: 'Surveillez la durée d’une chose. En gros, un chronomètre avec des fonctions de chronomètre simples.'
    title: 'Chronomètre'
  color-contrast-checker:
    description: 'Vérifiez le rapport de contraste de deux couleurs selon les seuils WCAG 2.1 AA et AAA pour le texte et les composants d''interface.'
    title: 'Vérificateur de contraste des couleurs'
  color-converter:
    description: 'Convertissez les couleurs entre les différents formats (hex, rgb, hsl et nom CSS)'
    title: 'Convertisseur de couleurs'
  commit-memo:
    description: 'Aide-mémoire des conventional commits avec exemples et outils courants'
    title: 'Aide-mémoire des conventional commits'
  common-regex-memo:
    description: 'Aide-mémoire des motifs regex courants'
    title: 'Aide-mémoire regex'
  crontab-generator:
    description: 'Valide et génère des crontabs, et obtient la description lisible du planning cron.'
    title: 'Générateur de crontab'
  csr-generator:
    description: 'Génère une demande de signature de certificat (CSR) et sa paire de clés, avec prise en charge de plusieurs domaines et adresses IP dans le SAN.'
    title: 'Générateur de CSR'
  css-js-formatter:
    description: 'Formatez et embellissez du code CSS ou JavaScript. Choisissez la taille d’indentation, l’indentation par tabulations ou par espaces et le fin de ligne.'
    title: 'Formateur CSS et JavaScript'
  csv-to-json:
    description: 'Convertissez du CSV en JSON avec champs entre guillemets RFC 4180, délimiteurs personnalisés, en-têtes optionnels et détection des types.'
    title: 'CSV vers JSON'
  data-size-converter:
    description: 'Convertissez les tailles de données entre octets, kilooctets, mégaoctets, gigaoctets, téraoctets et pétaoctets, avec une base décimale (SI) ou binaire (IEC) au choix.'
    title: 'Convertisseur de taille de données'
  date-calculator:
    description: 'Ajoutez ou soustrayez des jours, trouvez la différence entre deux dates et calculez un âge — toujours sur le jour calendaire, donc l''heure d''été ne décale jamais un résultat.'
    title: 'Calculateur de dates'
  date-converter:
    description: 'Convertis une date et une heure dans les différents formats'
    title: 'Convertisseur de date et d''heure'
  device-information:
    description: 'Obtenez des informations sur votre appareil actuel (taille de l''écran, ratio de pixels, user agent, ...)'
    title: 'Informations sur l''appareil'
  dns-query:
    description: 'Interrogez les enregistrements A, AAAA, CNAME, MX, TXT, NS, SOA, SRV, PTR et CAA d''un nom de domaine.'
    title: 'Recherche d''enregistrements DNS'
  dns-record-generator:
    description: 'Construisez les enregistrements TXT derrière l''authentification des e-mails — SPF, DKIM, DMARC et BIMI. Remplissez le formulaire et obtenez le nom et la valeur de l''enregistrement à coller dans votre zone DNS.'
    title: 'Générateur d''enregistrements DNS'
  docker-compose-validator:
    description: 'Valide un fichier docker-compose.yml et liste ses erreurs de syntaxe et ses problèmes sémantiques, avec leur emplacement et une correction suggérée.'
    title: 'Validateur Docker Compose'
  docker-run-to-docker-compose-converter:
    description: 'Transformez les commandes "docker run" en fichiers docker-compose !'
    title: 'Convertisseur docker run vers Docker compose'
  email-header-parser:
    description: 'Analysez les en-têtes d''e-mail bruts en sections lisibles — liste d''expéditeur/destinataires, objet, date, chemin de livraison Received et résultats SPF/DKIM/DMARC. Décode les mots encodés en RFC 2047 et déplie les en-têtes repliés.'
    title: 'Analyseur d''en-têtes d''e-mail'
  email-normalizer:
    description: 'Normalisez une adresse e-mail — en minuscules, sans les points des alias de type Gmail, et plus encore.'
    title: 'Normaliseur d''adresses e-mail'
  emoji-picker:
    description: 'Copiez et collez facilement des emojis et obtenez la valeur Unicode et les points de code de chaque emoji.'
    title: 'Sélecteur d''émojis'
  encryption:
    description: 'Chiffrez et déchiffrez du texte clair à l''aide d''algorithmes cryptographiques comme AES, TripleDES, Rabbit ou RC4.'
    title: 'Chiffrer / déchiffrer du texte'
  eta-calculator:
    description: 'Un calculateur d''ETA (Estimated Time of Arrival) pour déterminer l''heure de fin approximative d''une tâche, par exemple la fin et la durée d''un téléchargement de fichier.'
    title: 'Calculateur d''ETA'
  exif-reader:
    description: 'Lisez les métadonnées EXIF d''une image : marque et modèle de l''appareil photo, date de prise de vue, réglages d''exposition et coordonnées GPS.'
    title: 'Lecteur EXIF'
  exif-remover:
    description: 'Liste les segments de métadonnées d''un JPEG, PNG ou WebP et supprime ceux que tu choisis — les données de l''image sont copiées octet pour octet, jamais ré-encodées.'
    title: 'Supprimer les métadonnées d''une image'
  git-memo:
    description: 'Git est un logiciel de gestion de versions décentralisé. Avec cette aide-mémoire, vous avez un accès rapide aux commandes git les plus courantes.'
    title: 'Aide-mémoire Git'
  har-sanitizer:
    description: 'Supprimez les jetons, les cookies et autres données sensibles d''un fichier HAR avant de le partager.'
    title: 'Nettoyeur HAR'
  hash-text:
    description: 'Hachez une chaîne de texte avec la fonction dont vous avez besoin : MD5, SHA1, SHA256, SHA224, SHA512, SHA384, SHA3, RIPEMD160, BLAKE2, BLAKE3, Keccak, xxHash, Adler-32, CRC-32, CRC-32C — ou toutes en une seule fois'
    title: 'Hacher du texte'
  hmac-generator:
    description: 'Calcule un code d''authentification de message basé sur le hachage (HMAC) à l''aide d''une clé secrète et de votre fonction de hachage préférée.'
    title: 'Générateur HMAC'
  html-entities:
    description: 'Échappez ou déchappez les entités HTML (remplacez les caractères comme <, >, &, " et '' par leur version HTML).'
    title: 'Échappement d''entités HTML'
  html-to-markdown:
    description: 'Convertissez du HTML en Markdown. Gère les titres, les liens, les listes, les citations, les blocs de code et les images, ainsi que les tableaux GFM, le texte barré et les listes de tâches.'
    title: 'HTML vers Markdown'
  html-wysiwyg-editor:
    description: 'Éditeur HTML WYSIWYG en ligne, riche en fonctionnalités, qui génère immédiatement le code source du contenu.'
    title: 'Éditeur HTML WYSIWYG'
  htpasswd:
    description: 'Générez et vérifiez des lignes .htpasswd Apache sans installer apache2-utils. Produit une ligne `username:hash` que vous pouvez coller directement dans une variable d''environnement docker-compose. Prend en charge bcrypt (le standard Apache depuis 2.4.4), apr1 MD5 (l''ancien standard, encore courant sous Windows et sur les partages réseau), {SHA} et le texte brut.'
    title: 'Générateur htpasswd'
  http-status-codes:
    description: 'La liste de tous les codes de statut HTTP, de leur nom et de leur signification.'
    title: 'Codes de statut HTTP'
  iana-timezone-index:
    description: 'Index interrogeable de la base de données des fuseaux horaires IANA. Recherchez un fuseau par son nom, par son abréviation (CST) ou par son décalage UTC (UTC+8), et voyez le décalage actuel, le décalage standard, si l’heure d’été est en vigueur et l’heure locale actuelle.'
    title: 'Index des fuseaux horaires IANA'
  iban-validator-and-parser:
    description: 'Validez et analysez des numéros IBAN. Vérifiez si un IBAN est valide et obtenez le pays, le BBAN, s''il s''agit d''un QR-IBAN et le format IBAN lisible.'
    title: 'Validateur et analyseur d''IBAN'
  ical-generator:
    description: 'Créez un événement de calendrier .ics conforme à la RFC 5545, avec des heures en UTC et sans VTIMEZONE.'
    title: 'Générateur iCal'
  ical-parser:
    description: 'Analysez un fichier .ics en un tableau lisible d''événements, avec les lignes repliées dépliées et le texte déséchappé.'
    title: 'Analyseur iCal'
  icon-generator:
    description: 'Générez des jeux d''icônes d''application, un manifeste PWA et une archive ZIP à partir d''une seule image.'
    title: 'Générateur d''icônes'
  integer-to-ip:
    description: 'Convertissez un entier en adresse IPv4, en adresse IPv6 RFC 5952, en hexadécimal et en binaire.'
    title: 'Entier vers IP'
  ipv4-address-converter:
    description: 'Convertissez une adresse IP en décimal, binaire, hexadécimal ou même en IPv6.'
    title: 'Convertisseur d''adresse IPv4'
  ipv4-range-expander:
    description: 'À partir d''une adresse IPv4 de début et d''une adresse IPv4 de fin, cet outil calcule un sous-réseau IPv4 valide ainsi que sa notation CIDR.'
    title: 'Extension de plage IPv4'
  ipv4-subnet-calculator:
    description: 'Analysez vos blocs CIDR IPv4 et obtenez toutes les informations nécessaires sur votre sous-réseau.'
    title: 'Calculateur de sous-réseau IPv4'
  ipv6-address-converter:
    description: 'Convertissez une adresse IPv6 en ses formes étendue, compressée, décimale, hexadécimale et binaire, ainsi que le nom inverse ARPA et le type d’adresse.'
    title: 'Convertisseur d’adresses IPv6'
  ipv6-subnet-calculator:
    description: 'Calcule l''adresse réseau, le premier et le dernier hôte, le nombre d''adresses, le masque de réseau et le masque joker d''un bloc IPv6 CIDR, et divise-le en sous-réseaux plus petits.'
    title: 'Calculateur de sous-réseaux IPv6'
  ipv6-ula-generator:
    description: 'Génère vos propres adresses IP locales et non routables pour votre réseau, conformément à la RFC4193.'
    title: 'Générateur d''ULA IPv6'
  jasypt:
    description: 'Chiffrez et déchiffrez les valeurs `ENC(...)` que `jasypt-spring-boot` lit dans application.yml, sans monter de projet Java. Prend en charge PBEWithMD5AndDES (PBKDF1-MD5 + DES-CBC, le défaut de Spring Boot) et PBEWITHHMACSHA512ANDAES_256 (PBKDF2-HMAC-SHA512 + AES-256-CBC). Le nombre d''itérations et la longueur du sel ne sont pas inscrits dans le texte chiffré, les deux doivent correspondre au déchiffrement ; les valeurs par défaut ici sont celles de Jasypt lui-même.'
    title: 'Chiffreur / déchiffreur de chaînes Jasypt'
  json-diff:
    description: 'Comparez deux objets JSON et obtenez les différences entre eux.'
    title: 'Différence JSON'
  json-minify:
    description: 'Minifiez et compressez votre JSON en supprimant les espaces superflus.'
    title: 'Minifier du JSON'
  json-prettify:
    description: 'Embellissez votre chaîne JSON dans un format lisible par un humain.'
    title: 'Embellir et formater du JSON'
  json-to-csharp:
    description: 'Convertissez du JSON en définitions de types C# (classes ou records).'
    title: 'JSON vers C#'
  json-to-csv:
    description: 'Convertissez du JSON en CSV avec détection automatique des en-têtes.'
    title: 'JSON vers CSV'
  json-to-go:
    description: 'Convertis du JSON en définitions de types Go (structures).'
    title: 'JSON vers Go'
  json-to-toml:
    description: 'Analysez et convertissez du JSON en TOML.'
    title: 'JSON vers TOML'
  json-to-xml:
    description: 'Convertissez des documents JSON en XML. Pratique pour l''échange de données et le débogage d''API.'
    title: 'JSON vers XML'
  json-to-yaml-converter:
    description: 'Convertissez simplement du JSON en YAML avec ce convertisseur en ligne.'
    title: 'Convertisseur JSON vers YAML'
  jwt-generator:
    description: 'Générez un JSON Web Token signé (HS/RS/PS/ES) et vérifiez sa signature.'
    title: 'Générateur de JWT'
  jwt-parser:
    description: 'Analysez et décodez votre JSON Web Token (JWT) et affichez son contenu.'
    title: 'Analyseur de JWT'
  keycode-info:
    description: 'Trouvez le keycode JavaScript, le code, la position et les modificateurs de n''importe quelle touche pressée.'
    title: 'Infos keycode'
  list-converter:
    description: 'Cet outil peut traiter des données en colonnes et appliquer diverses modifications (transposition, ajout de préfixe et de suffixe, inversion de la liste, tri de la liste, passage des valeurs en minuscules, troncature des valeurs) à chaque ligne.'
    title: 'Convertisseur de liste'
  lorem-ipsum-generator:
    description: 'Lorem ipsum est un texte de remplissage couramment utilisé pour démontrer la forme visuelle d''un document ou d''une police sans recourir à un contenu significatif'
    title: 'Générateur de Lorem Ipsum'
  mac-address-generator:
    description: 'Indiquez la quantité et le préfixe. Les adresses MAC sont générées dans la casse choisie (majuscules ou minuscules)'
    title: 'Générateur d''adresses MAC'
  mac-address-lookup:
    description: 'Trouvez le fournisseur et le fabricant d''un appareil à partir de son adresse MAC.'
    title: 'Recherche d''adresse MAC'
  markdown-cheatsheet:
    description: 'Aide-mémoire Markdown'
    title: 'Aide-mémoire Markdown'
  markdown-table-formatter:
    description: 'Aligne les colonnes d''un tableau Markdown : chaque colonne est complétée jusqu''à sa cellule la plus large, la ligne de séparation est reconstruite à cette mesure et les repères d''alignement sont conservés.'
    title: 'Formateur de tableaux Markdown'
  markdown-table-generator:
    description: 'Créez un tableau Markdown compatible GitHub dans un éditeur visuel : ajoutez ou supprimez des lignes et des colonnes, définissez l''alignement de chaque colonne et copiez le résultat.'
    title: 'Générateur de tableau Markdown'
  markdown-to-html:
    description: 'Transforme du texte Markdown en HTML que tu peux coller directement dans une page, un e-mail ou un document.'
    title: 'Markdown vers HTML'
  math-evaluator:
    description: 'Un calculateur pour évaluer des expressions mathématiques. Vous pouvez utiliser des fonctions comme sqrt, cos, sin, abs, etc.'
    title: 'Évaluateur d''expressions mathématiques'
  mime-types:
    description: 'Convertissez les types MIME en extensions de fichier et inversement.'
    title: 'Types MIME'
  morse-code:
    description: 'Encodez du texte en code Morse et décodez le code Morse en texte.'
    title: 'Convertisseur de code Morse'
  nano-memo:
    description: 'Aide-mémoire de l''éditeur Nano'
    title: 'Aide-mémoire Nano'
  numeronym-generator:
    description: 'Un numeronym est un mot où un nombre est utilisé pour former une abréviation. Par exemple, « i18n » est un numeronym de « internationalization », où 18 correspond au nombre de lettres entre le premier i et le dernier n du mot.'
    title: 'Générateur de numeronyms'
  object-id:
    description: 'Générez des ObjectId MongoDB et examinez leur structure (horodatage, valeur aléatoire, compteur). L''outil date-time-converter convertit déjà les dates dans les deux sens vers le format mongo-objectid ; celui-ci couvre donc la génération et l''analyse structurelle.'
    title: 'MongoDB ObjectId'
  og-meta-generator:
    description: 'Générez des balises méta HTML Open Graph et sociales pour votre site web.'
    title: 'Générateur de balises méta Open Graph'
  otp-generator:
    description: 'Générez et validez des OTP (mots de passe à usage unique) basés sur le temps ou sur les événements pour l''authentification multifacteur.'
    title: 'Générateur de codes OTP'
  password-strength-analyser:
    description: 'Découvrez la robustesse de votre mot de passe avec cet analyseur de robustesse de mot de passe et cet estimateur de temps de cassage, entièrement côté client.'
    title: 'Analyseur de robustesse de mot de passe'
  pdf-signature-checker:
    description: 'Vérifiez les signatures d''un fichier PDF. Un fichier PDF signé contient une ou plusieurs signatures qui permettent de déterminer si le contenu du fichier a été modifié depuis sa signature.'
    title: 'Vérificateur de signatures PDF'
  percentage-calculator:
    description: 'Calculez facilement des pourcentages d''une valeur à une autre, ou d''un pourcentage à une valeur.'
    title: 'Calculateur de pourcentage'
  phone-parser-and-formatter:
    description: 'Analysez, validez et formatez des numéros de téléphone. Obtenez des informations sur le numéro, comme l’indicatif du pays, le type, etc.'
    title: 'Analyseur et formateur de numéros de téléphone'
  punycode-converter:
    description: 'Convertissez des noms de domaine internationalisés ou des adresses e-mail vers et depuis l’ASCII Punycode (RFC 3492).'
    title: 'Convertisseur Punycode'
  qrcode-generator:
    description: 'Générez et téléchargez un QR code pour une URL (ou simplement du texte), et personnalisez les couleurs d''arrière-plan et de premier plan.'
    title: 'Générateur de QR code'
  random-port-generator:
    description: 'Générez des numéros de port aléatoires en dehors de la plage des ports « connus » (0-1023).'
    title: 'Générateur de ports aléatoires'
  regex-memo:
    description: 'Une aide-mémoire des constructions d''expressions régulières les plus courantes.'
    title: 'Aide-mémoire des regex'
  regex-tester:
    description: 'Écrivez une expression régulière et testez-la en direct sur une chaîne d''exemple.'
    title: 'Testeur de regex'
  roman-numeral-converter:
    description: 'Convertissez les chiffres romains en nombres et les nombres en chiffres romains.'
    title: 'Convertisseur de chiffres romains'
  rsa-key-pair-generator:
    description: 'Générez une nouvelle paire de clés RSA aléatoires, privée et publique, au format PEM.'
    title: 'Générateur de paire de clés RSA'
  safelink-decoder:
    description: 'Décodez les SafeLinks d''Outlook pour révéler l''URL vers laquelle ils pointent réellement.'
    title: 'Décodeur de SafeLinks'
  slugify-string:
    description: 'Rendez une chaîne sûre pour une URL, un nom de fichier et un identifiant.'
    title: 'Slugifier une chaîne'
  sql-prettify:
    description: 'Mettez en forme et embellissez vos requêtes SQL en ligne (plusieurs dialectes SQL sont pris en charge).'
    title: 'Embellir et formater du SQL'
  ssh-key-pair-generator:
    description: 'Générez une paire de clés SSH au format OpenSSH (ed25519, ECDSA P-256 ou RSA), avec une phrase secrète facultative, la ligne authorized_keys correspondante et l''empreinte SHA256.'
    title: 'Générateur de paire de clés SSH'
  ssl-certificate-decoder:
    description: 'Décode un certificat X.509 et affiche son sujet, son émetteur, sa période de validité, sa clé publique, ses entrées SAN et ses empreintes. Accepte le PEM, le base64 ou le DER en hexadécimal — une chaîne complète de certificats peut être collée d''un coup.'
    title: 'Décodeur de certificat SSL'
  stacktrace-formatter:
    description: 'Analyse une trace d''appels (V8, Firefox, Java, Python, .NET) en frames, et copie-la en texte aligné ou en HTML mis en évidence.'
    title: 'Formateur de traces d''appels'
  string-obfuscator:
    description: 'Obscurcissez une chaîne (comme un secret, un IBAN ou un jeton) pour la partager et l''identifier sans en révéler le contenu.'
    title: 'Obfuscateur de chaînes'
  svg-placeholder-generator:
    description: 'Générez des images SVG à utiliser comme images de remplacement dans vos applications.'
    title: 'Générateur d''images de remplacement SVG'
  temperature-converter:
    description: 'Conversion de températures en degrés pour Kelvin, Celsius, Fahrenheit, Rankine, Delisle, Newton, Réaumur et Rømer.'
    title: 'Convertisseur de température'
  text-diff:
    description: 'Comparez deux textes et voyez les différences entre eux.'
    title: 'Différence de texte'
  text-statistics:
    description: 'Obtenez des informations sur un texte : le nombre de caractères, le nombre de mots, sa taille en octets, ...'
    title: 'Statistiques de texte'
  text-to-binary:
    description: 'Convertissez du texte en sa représentation binaire UTF-8 et inversement.'
    title: 'Texte vers binaire UTF-8'
  text-to-nato-alphabet:
    description: 'Transformez du texte en alphabet phonétique NATO pour la transmission orale. Prend aussi en charge les alphabets d''épellation allemand (DIN 5008), français, espagnol et russe.'
    title: 'Texte vers alphabet NATO'
  text-to-unicode:
    description: 'Analysez et convertissez du texte en unicode et inversement'
    title: 'Texte vers Unicode'
  token-generator:
    description: 'Générez une chaîne aléatoire avec les caractères de votre choix, des lettres majuscules ou minuscules, des chiffres et/ou des symboles.'
    title: 'Générateur de jetons'
  toml-to-json:
    description: 'Analysez et convertissez du TOML en JSON.'
    title: 'TOML vers JSON'
  toml-to-yaml:
    description: 'Analysez et convertissez du TOML en YAML.'
    title: 'TOML vers YAML'
  ulid-generator:
    description: 'Générez des Universally Unique Lexicographically Sortable Identifier (ULID) aléatoires.'
    title: 'Générateur d''ULID'
  unit-converter:
    description: 'Convertissez des valeurs entre des unités de longueur, masse, surface, volume, temps, vitesse, angle, pression, énergie, puissance, force et taille de données.'
    title: 'Convertisseur d’unités'
  url-encoder:
    description: 'Encodez du texte au format URL-encodé (aussi appelé « percent-encoding »), ou décodez-le.'
    title: 'Encoder/décoder des chaînes au format URL'
  url-parser:
    description: 'Analysez une URL pour en extraire les différentes parties (protocole, origine, paramètres, port, nom d''utilisateur-mot de passe, ...)'
    title: 'Analyseur d''URL'
  user-agent-parser:
    description: 'Détectez et analysez le navigateur, le moteur, le système d’exploitation, le CPU et le type/modèle d’appareil à partir d’une chaîne user-agent.'
    title: 'Analyseur de user-agent'
  uuid-generator:
    description: 'Un Universally Unique Identifier (UUID) est un nombre de 128 bits utilisé pour identifier des informations dans les systèmes informatiques. Le nombre de UUID possibles est de 16^32, soit 2^128 ou environ 3,4x10^38 (ce qui est beaucoup !).'
    title: 'Générateur d''UUID'
  uuid-parser:
    description: 'Analysez les UUID et affichez leur version, leur variante, leur horodatage, la séquence d''horloge, l''identifiant de nœud et la forme GUID Microsoft.'
    title: 'Analyseur d''UUID'
  week-number-converter:
    description: 'Convertissez entre dates, numéros de semaine ISO et semaine du mois. La semaine commence le lundi ; la semaine 1 d''un mois est celle qui contient le 1er.'
    title: 'Convertisseur de numéros de semaine'
  wifi-qrcode-generator:
    description: 'Générez et téléchargez des QR codes pour vous connecter rapidement aux réseaux WiFi.'
    title: 'Générateur de QR code WiFi'
  x509-certificate-generator:
    description: 'Générez un certificat X.509 auto-signé et sa clé privée, avec plusieurs domaines et adresses IP dans le SAN.'
    title: 'Générateur de certificat X.509'
  xml-diff:
    description: 'Comparez deux documents XML et mettez en évidence les différences.'
    title: 'Différence XML'
  xml-formatter:
    description: 'Mettez en forme votre chaîne XML dans un format lisible par un humain.'
    title: 'Formateur XML'
  xml-to-json:
    description: 'Convertissez des documents XML en JSON. Pratique pour l’échange de données et le débogage d’API.'
    title: 'XML vers JSON'
  yaml-prettify:
    description: 'Mettez en forme votre chaîne YAML dans un format lisible par un humain.'
    title: 'Embellir et formater du YAML'
  yaml-to-json-converter:
    description: 'Convertissez simplement du YAML en JSON avec ce convertisseur en ligne.'
    title: 'Convertisseur YAML vers JSON'
  yaml-to-toml:
    description: 'Analysez et convertissez du YAML en TOML.'
    title: 'YAML vers TOML'

