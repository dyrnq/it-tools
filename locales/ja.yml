# ja 语言包。
#
# 英文从 `locales/en.yml` 来，这个文件是同结构的其他语言。
# 键没译到的会**逐条**回退到英文（见 src/i18n.rs 的 t()），
# 所以这个文件可以只写一部分 —— 缺的那条显示英文，不会露出键名。
#
# 由 scripts/i18n/merge.py 从 new-tool/i18n/ja/ 下的翻译片段合并而成。
#

tools:
  argon2-hash-generator:
    description: 'Argon2 (argon2id、argon2i、argon2d) を使ってテキスト文字列をハッシュ化し、比較します。メモリサイズ、反復回数、並列数、ハッシュ長は設定できます。Argon2 は Password Hashing Competition の優勝者で、パスワード保存の現行の推奨方式です。'
    title: 'Argon2 ハッシュ生成'
  ascii-text-drawer:
    description: '単語や数行のテキストを ASCII アートとして描画します。'
    title: 'ASCII テキスト描画'
  base-converter:
    description: '数値を異なる基数 (10 進、16 進、2 進、8 進、base64 など) 間で変換します'
    title: '整数の基数変換'
  base64-file-converter:
    description: '文字列・ファイル・画像を Base64 表現に変換します。'
    title: 'Base64 ファイル変換'
  base64-string-converter:
    description: '文字列を Base64 表現にエンコード・デコードします。'
    title: 'Base64 文字列エンコード/デコード'
  basic-auth-generator:
    description: 'ユーザー名とパスワードから base64 の Basic 認証ヘッダーを生成します。'
    title: 'Basic 認証ジェネレーター'
  bcrypt:
    description: 'bcrypt を使ってテキスト文字列をハッシュ化し、比較します。bcrypt は Blowfish 暗号に基づくパスワードハッシュ関数です。'
    title: 'Bcrypt'
  benchmark-builder:
    description: 'このシンプルなオンラインベンチマークビルダーで、タスクの実行時間を簡単に比較できます。'
    title: 'ベンチマークビルダー'
  bip39-generator:
    description: '既存のまたはランダムなニーモニックから BIP39 パスフレーズを生成する、またはパスフレーズからニーモニックを取得します。'
    title: 'BIP39 パスフレーズ生成'
  camera-recorder:
    description: 'ウェブカメラやカメラから写真を撮ったり、動画を録画したりします。'
    title: 'カメラ録画'
  case-converter:
    description: '文字列の大文字・小文字を変え、フォーマットを選べます。'
    title: '大文字・小文字変換'
  categories:
    converter: '変換'
    crypto: '暗号'
    data: 'データ'
    development: '開発'
    'images and videos': '画像と動画'
    math: '数学'
    measurement: '計測'
    network: 'ネットワーク'
    text: 'テキスト'
    web: 'Web'
  chinese-number-converter:
    description: '中国数字とアラビア数字を相互に変換します。大書きの漢数字（壹贰叁）、通常の数字、人民幣金額、繁体字の表記にも対応しています。'
    title: '中国数字変換'
  chmod-calculator:
    description: 'このオンライン chmod 計算機で chmod の権限とコマンドを計算します。'
    title: 'chmod 計算機'
  chronometer:
    description: '時間の長さを計測します。要するに、基本機能だけのクロノメーターです。'
    title: 'クロノメーター'
  color-contrast-checker:
    description: 'WCAG 2.1 の AA と AAA のテキストおよび UI コンポーネントのしきい値に対して、2 色のコントラスト比を確認します。'
    title: 'コントラストチェッカー'
  color-converter:
    description: '色を異なる形式 (hex、rgb、hsl、CSS 名) 間で変換します'
    title: 'カラーコンバーター'
  commit-memo:
    description: '例とよく使うツールをまとめた Conventional Commits のチートシート'
    title: 'Conventional Commit チートシート'
  common-regex-memo:
    description: 'よく使う正規表現パターンのチートシート'
    title: '正規表現チートシート'
  crontab-generator:
    description: 'crontab を検証・生成し、cron スケジュールの読みやすい説明を取得します。'
    title: 'crontab ジェネレーター'
  csr-generator:
    description: '証明書署名要求 (CSR) とその鍵ペアを生成します。SAN に複数のドメインや IP アドレスを持たせられます。'
    title: 'CSR ジェネレーター'
  css-js-formatter:
    description: 'CSS や JavaScript のコードを整形して読みやすくします。インデント幅、タブ／スペースのインデント、末尾の改行コードを選べます。'
    title: 'CSS・JavaScript フォーマッタ'
  csv-to-json:
    description: 'RFC 4180 の引用符付きフィールド、任意の区切り文字、任意の見出し行、型推論に対応した CSV を JSON に変換します。'
    title: 'CSV から JSON'
  data-size-converter:
    description: 'バイト、キロバイト、メガバイト、ギガバイト、テラバイト、ペタバイトの間でデータサイズを換算します。10 進 (SI) と 2 進 (IEC) の基数を切り替えられます。'
    title: 'データサイズ変換'
  date-calculator:
    description: '日数を加算・減算し、2 つの日付の差を求め、年齢を計算します。すべて暦日ベースなので、夏時間の切り替えで結果がずれることはありません。'
    title: '日付計算機'
  date-converter:
    description: '日時をさまざまな形式に変換します'
    title: '日時変換'
  device-information:
    description: '現在のデバイスに関する情報を取得します（画面サイズ、ピクセル比、ユーザーエージェントなど）。'
    title: 'デバイス情報'
  dns-query:
    description: 'ドメイン名に対して A、AAAA、CNAME、MX、TXT、NS、SOA、SRV、PTR、CAA レコードを検索します。'
    title: 'DNS レコード検索'
  dns-record-generator:
    description: 'メール認証 (SPF、DKIM、DMARC、BIMI) の裏側にある TXT レコードを作成します。フォームに記入すると、DNS ゾーンに貼り付けられるレコード名と値が得られます。'
    title: 'DNS レコード生成ツール'
  docker-compose-validator:
    description: 'docker-compose.yml ファイルを検証し、構文エラーと意味的な問題を、その位置と修正案つきで一覧表示します。'
    title: 'Docker Compose バリデーター'
  docker-run-to-docker-compose-converter:
    description: '"docker run" コマンドを docker-compose ファイルに変換します!'
    title: 'docker run から Docker compose へのコンバーター'
  email-header-parser:
    description: '生のメールヘッダーを読みやすいセクションに分解します。送信者・受信者リスト、件名、日付、Received の配信経路、SPF/DKIM/DMARC の結果を表示し、RFC 2047 のエンコード済みワードをデコード、折り返されたヘッダーを展開します。'
    title: 'メールヘッダーパーサ'
  email-normalizer:
    description: 'メールアドレスを正規化します — 小文字化、Gmail 形式のエイリアスからドットを除去するなど。'
    title: 'メールアドレス正規化'
  emoji-picker:
    description: '絵文字を簡単にコピー＆ペーストし、各絵文字の Unicode 値とコードポイントを取得できます。'
    title: '絵文字ピッカー'
  encryption:
    description: 'AES、TripleDES、Rabbit、RC4 などの暗号アルゴリズムを使って平文を暗号化し、暗号文を復号します。'
    title: 'テキストの暗号化 / 復号'
  eta-calculator:
    description: 'ETA（Estimated Time of Arrival、到着予定時刻）計算機。タスクのおおよその終了時刻を求めます（例：ファイルダウンロードの終了時刻と所要時間）。'
    title: 'ETA 計算機'
  exif-reader:
    description: '画像の EXIF メタデータを読み取ります：カメラメーカーとモデル、撮影日、露出設定、GPS 座標。'
    title: 'EXIF リーダー'
  exif-remover:
    description: 'JPEG、PNG、WebP 里面的メタデータセグメントを一覧表示して、選んだものを削除します。画像データ自体はバイト単位でそのままコピーされ、再エンコードはされません。'
    title: '画像メタデータを削除'
  git-memo:
    description: 'Git は分散型のバージョン管理ソフトウェアです。このチートシートがあれば、よく使う git コマンドにすぐアクセスできます。'
    title: 'Git チートシート'
  har-sanitizer:
    description: 'HAR ファイルを共有する前に、トークンや Cookie などの機密データを除去します。'
    title: 'HAR サニタイザー'
  hash-text:
    description: '必要な関数でテキスト文字列をハッシュします: MD5、SHA1、SHA256、SHA224、SHA512、SHA384、SHA3、RIPEMD160、BLAKE2、BLAKE3、Keccak、xxHash、Adler-32、CRC-32、CRC-32C — すべてまとめて計算することもできます'
    title: 'テキストのハッシュ'
  hmac-generator:
    description: '秘密鍵と任意のハッシュ関数を使って、ハッシュベースメッセージ認証コード (HMAC) を計算します。'
    title: 'HMAC ジェネレーター'
  html-entities:
    description: 'HTML エンティティをエスケープまたは解除します（<,>, &, " や '' などの文字を HTML 表現に変換します）。'
    title: 'HTML エンティティのエスケープ'
  html-to-markdown:
    description: 'HTML を Markdown に変換します。見出し、リンク、リスト、引用、コードブロック、画像のほか、GFM の表、打ち消し線、タスクリストにも対応しています。'
    title: 'HTML → Markdown'
  html-wysiwyg-editor:
    description: 'コンテンツのソースコードを即座に生成する、機能豊富なオンライン WYSIWYG HTML エディタ。'
    title: 'HTML WYSIWYG エディタ'
  htpasswd:
    description: 'apache2-utils をインストールせずに Apache の .htpasswd 行を生成・検証します。docker-compose の環境変数にそのまま貼り付けられる `username:hash` 形式で 1 行を出力します。bcrypt（2.4.4 以降の Apache の既定）、apr1 MD5（旧既定。Windows やネットワーク共有で今も一般的）、{SHA}、平文に対応しています。'
    title: 'htpasswd ジェネレーター'
  http-status-codes:
    description: 'すべての HTTP ステータスコード、その名前、意味の一覧です。'
    title: 'HTTP ステータスコード'
  iana-timezone-index:
    description: 'IANA タイムゾーンデータベースを検索できるインデックスです。名前、略称 (CST)、UTC オフセット (UTC+8) のいずれかでゾーンを引くと、現在のオフセット、標準オフセット、夏時間が適用されているか、現在地の時刻が分かります。'
    title: 'IANA タイムゾーンインデックス'
  iban-validator-and-parser:
    description: 'IBAN 番号を検証して解析します。IBAN が有効かどうかを確認し、国、BBAN、QR-IBAN かどうか、読みやすい IBAN 形式を取得できます。'
    title: 'IBAN 検証・解析'
  ical-generator:
    description: 'RFC 5545 準拠の .ics カレンダーイベントを作成します。時刻は UTC で、VTIMEZONE は不要です。'
    title: 'iCal ジェネレーター'
  ical-parser:
    description: '.ics ファイルを読みやすいイベント表に解析します。折り返し行は展開し、テキストはエスケープを解除します。'
    title: 'iCal パーサー'
  icon-generator:
    description: '1 枚の画像からアプリ用アイコン一式、PWA マニフェスト、ZIP アーカイブを生成します。'
    title: 'アイコン生成'
  integer-to-ip:
    description: '整数を IPv4 アドレス、RFC 5952 の IPv6 アドレス、16 進数、2 進数に変換します。'
    title: '整数から IP へ'
  ipv4-address-converter:
    description: 'IP アドレスを 10 進数、2 進数、16 進数、さらに IPv6 表現に変換します。'
    title: 'IPv4 アドレス変換'
  ipv4-range-expander:
    description: '開始と終了の IPv4 アドレスを指定すると、有効な IPv4 サブネットと CIDR 表記を計算します。'
    title: 'IPv4 範囲展開ツール'
  ipv4-subnet-calculator:
    description: 'IPv4 の CIDR ブロックを解析し、サブネットについて必要な情報をすべて取得します。'
    title: 'IPv4 サブネット計算ツール'
  ipv6-address-converter:
    description: 'IPv6 アドレスを、展開形式・圧縮形式・10 進数・16 進数・バイナリ表現と、ARPA 逆引き名、アドレス種別に変換します。'
    title: 'IPv6 アドレス変換'
  ipv6-subnet-calculator:
    description: 'IPv6 CIDR ブロックのネットワークアドレス、最初と最後のホスト、アドレス数、ネットマスク、ワイルドカードマスクを計算し、より小さなサブネットに分割します。'
    title: 'IPv6 サブネット計算機'
  ipv6-ula-generator:
    description: 'RFC4193 に基づいて、ネットワーク用のローカルでルーティングされない IP アドレスを生成します。'
    title: 'IPv6 ULA ジェネレーター'
  jasypt:
    description: 'Java プロジェクトを用意せずに、`jasypt-spring-boot` が application.yml から読み込む `ENC(...)` の値を暗号化・復号します。PBEWithMD5AndDES (PBKDF1-MD5 + DES-CBC、Spring Boot の既定) と PBEWITHHMACSHA512ANDAES_256 (PBKDF2-HMAC-SHA512 + AES-256-CBC) に対応しています。反復回数とソルト長は暗号文に含まれないため、復号時に両者が一致している必要があります。ここの既定値は Jasypt 本体と同じです。'
    title: 'Jasypt 文字列暗号化 / 復号ツール'
  json-diff:
    description: '2 つの JSON オブジェクトを比較し、違いを確認します。'
    title: 'JSON 差分'
  json-minify:
    description: '不要な空白を削除して、JSON を圧縮します。'
    title: 'JSON の圧縮'
  json-prettify:
    description: 'JSON 文字列を人が読みやすい形に整形します。'
    title: 'JSON の整形・Beautアップ'
  json-to-csharp:
    description: 'JSON を C# の型定義（クラスまたはレコード）に変換します。'
    title: 'JSON から C#'
  json-to-csv:
    description: 'ヘッダーを自動検出しながら JSON を CSV に変換します。'
    title: 'JSON から CSV'
  json-to-go:
    description: 'JSON を Go の型定義（構造体）に変換します。'
    title: 'JSON から Go'
  json-to-toml:
    description: 'JSON を解析して TOML に変換します。'
    title: 'JSON → TOML'
  json-to-xml:
    description: 'JSON ドキュメントを XML に変換します。データ交換や API のデバッグに便利です。'
    title: 'JSON から XML'
  json-to-yaml-converter:
    description: 'このオンライン変換ツールで JSON を YAML に簡単に変換します。'
    title: 'JSON から YAML への変換'
  jwt-generator:
    description: '署名済み JSON Web Token (HS/RS/PS/ES) を生成し、署名を検証します。'
    title: 'JWT ジェネレーター'
  jwt-parser:
    description: 'JSON Web Token (JWT) を解析・デコードして内容を表示します。'
    title: 'JWT パーサー'
  keycode-info:
    description: '押された任意のキーについて、JavaScript の keycode、code、位置、修飾キーを調べます。'
    title: 'Keycode 情報'
  list-converter:
    description: 'このツールは列単位のデータを処理し、各行にさまざまな変更 (転置、前後の文字列の追加、リストの反転、リストの並べ替え、値の小文字化、値の切り詰め) を適用できます。'
    title: 'リスト変換ツール'
  lorem-ipsum-generator:
    description: 'Lorem ipsum は、文書や書体の視覚的な形を示すために、意味のある内容に頼らずに用いられるプレースホルダーテキストです'
    title: 'Lorem ipsum ジェネレーター'
  mac-address-generator:
    description: '生成個数とプレフィックスを入力します。MAC アドレスは選択した大文字・小文字の形式で 生成されます'
    title: 'MAC アドレス生成'
  mac-address-lookup:
    description: 'MAC アドレスからデバイスのベンダーとメーカーを調べます。'
    title: 'MAC アドレス検索'
  markdown-cheatsheet:
    description: 'Markdown チートシート'
    title: 'Markdown チートシート'
  markdown-table-formatter:
    description: 'Markdown テーブルの列をそろえます。各列は最も広いセルに合わせて空白を詰め、区切り行は列幅に合わせて作り直し、アラインメント記号はそのまま残します。'
    title: 'Markdown テーブル整形'
  markdown-table-generator:
    description: 'ビジュアルエディターで GitHub 形式の Markdown テーブルを作成します: 行・列の追加と削除、各列の配置の設定、結果のコピー。'
    title: 'Markdown テーブル生成'
  markdown-to-html:
    description: 'Markdown のテキストを、ページやメール、ドキュメントにそのまま貼り付けられる HTML に変換します。'
    title: 'Markdown から HTML'
  math-evaluator:
    description: '数式を評価する計算機です。sqrt、cos、sin、abs などの関数を使えます。'
    title: '数式エミュレータ'
  mime-types:
    description: 'MIME タイプをファイル拡張子に変換し、その逆も行います。'
    title: 'MIME タイプ'
  morse-code:
    description: 'テキストをモールス符号にエンコードし、モールス符号をテキストにデコードします。'
    title: 'モールス符号変換'
  nano-memo:
    description: 'Nano Editor のチートシート'
    title: 'Nano チートシート'
  numeronym-generator:
    description: 'numeronym は、数字を使って略語を作る語です。たとえば「i18n」は「internationalization」の numeronym で、18 はこの語の最初の i と最後の n の間にある文字数を表します。'
    title: 'Numeronym ジェネレーター'
  object-id:
    description: 'MongoDB の ObjectId を生成し、その構造 (タイムスタンプ、乱数値、カウンター) を調べます。日時の変換は date-time-converter ツールが両方向に対応済みなので、こちらは生成と構造の内訳を扱います。'
    title: 'MongoDB ObjectId'
  og-meta-generator:
    description: 'ウェブサイト用の Open Graph とソーシャル用の HTML メタタグを生成します。'
    title: 'Open Graph メタタグ生成'
  otp-generator:
    description: '多要素認証のために、時間ベースおよびイベントベースの OTP (ワンタイムパスワード) を生成し検証します。'
    title: 'OTP コード生成'
  password-strength-analyser:
    description: 'このクライアントサイド専用のパスワード強度解析ツールとクラック時間推定ツールで、パスワードの強さを確認します。'
    title: 'パスワード強度解析'
  pdf-signature-checker:
    description: 'PDF ファイルの署名を検証します。署名された PDF ファイルには 1 つ以上の署名が含まれ、署名後にファイルの内容が変更されたかどうかを判断できます。'
    title: 'PDF 署名チェック'
  percentage-calculator:
    description: 'ある値から別の値への割合や、パーセンテージから値への計算を簡単に行えます。'
    title: 'パーセント計算'
  phone-parser-and-formatter:
    description: '電話番号を解析・検証・整形します。国際電話コードや種類などの情報を取得できます。'
    title: '電話番号パーサー・フォーマッター'
  punycode-converter:
    description: '国際化ドメイン名やメールアドレスを ASCII Punycode（RFC 3492）と相互に変換します。'
    title: 'Punycode 変換'
  qrcode-generator:
    description: 'URL（またはプレーンテキスト）の QR コードを生成してダウンロードし、背景色と前景色をカスタマイズできます。'
    title: 'QR コード生成'
  random-port-generator:
    description: '「既知」のポート範囲 (0-1023) の外側にあるランダムなポート番号を生成します。'
    title: 'ランダムポートジェネレーター'
  regex-memo:
    description: '最もよく使われる正規表現の構文をまとめたチートシートです。'
    title: '正規表現チートシート'
  regex-tester:
    description: '正規表現を書き、サンプル文字列に対してライブでテストします。'
    title: '正規表現テスター'
  roman-numeral-converter:
    description: 'ローマ数字を数値に、数値をローマ数字に変換します。'
    title: 'ローマ数字変換'
  rsa-key-pair-generator:
