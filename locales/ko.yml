# ko 语言包。
#
# 英文从 `locales/en.yml` 来，这个文件是同结构的其他语言。
# 键没译到的会**逐条**回退到英文（见 src/i18n.rs 的 t()），
# 所以这个文件可以只写一部分 —— 缺的那条显示英文，不会露出键名。
#
# 由 scripts/i18n/merge.py 从 new-tool/i18n/ko/ 下的翻译片段合并而成。
#

tools:
  argon2-hash-generator:
    description: 'Argon2(argon2id, argon2i 또는 argon2d)로 텍스트 문자열을 해싱하고 비교합니다. 메모리 크기, 반복 횟수, 병렬성, 해시 길이를 설정할 수 있습니다. Argon2는 Password Hashing Competition 우승자이며, 비밀번호 저장에 현재 권장되는 방식입니다.'
    title: 'Argon2 해시 생성기'
  ascii-text-drawer:
    description: '단어나 몇 줄의 텍스트를 ASCII 아트로 그립니다.'
    title: 'ASCII 텍스트 드로잉'
  base-converter:
    description: '수를 서로 다른 진법으로 변환합니다(10진수, 16진수, 2진수, 8진수, base64, ...)'
    title: '정수 진법 변환기'
  base64-file-converter:
    description: '문자열, 파일 또는 이미지를 base64 표현으로 변환합니다.'
    title: 'Base64 파일 변환기'
  base64-string-converter:
    description: '문자열을 Base64 표현으로 간단히 인코딩하고 디코딩합니다.'
    title: 'Base64 문자열 인코더/디코더'
  basic-auth-generator:
    description: '사용자 이름과 비밀번호로 base64 Basic 인증 헤더를 생성합니다.'
    title: 'Basic 인증 생성기'
  bcrypt:
    description: 'bcrypt로 텍스트 문자열을 해싱하고 비교합니다. bcrypt는 Blowfish 암호를 기반으로 한 비밀번호 해싱 함수입니다.'
    title: 'Bcrypt'
  benchmark-builder:
    description: '이 아주 간단한 온라인 벤치마크 빌더로 작업의 실행 시간을 쉽게 비교할 수 있습니다.'
    title: '벤치마크 빌더'
  bip39-generator:
    description: '기존 또는 무작위 니모닉에서 BIP39 패스프레이즈를 생성하거나, 패스프레이즈에서 니모닉을 가져옵니다.'
    title: 'BIP39 패스프레이즈 생성기'
  camera-recorder:
    description: '웹캠이나 카메라로 사진을 찍거나 동영상을 녹화합니다.'
    title: '카메라 녹화'
  case-converter:
    description: '문자열의 대소문자를 바꾸고 원하는 형식을 고릅니다.'
    title: '대소문자 변환기'
  categories:
    converter: '변환'
    crypto: '암호화'
    data: '데이터'
    development: '개발'
    'images and videos': '이미지 및 동영상'
    math: '수학'
    measurement: '측정'
    network: '네트워크'
    text: '텍스트'
    web: '웹'
  chinese-number-converter:
    description: '중국어 숫자와 아라비아 숫자를 서로 변환합니다. 금융용 숫자(壹贰叁), 일반 숫자, RMB 금액, 번체자 표기를 모두 지원합니다.'
    title: '중국어 숫자 변환기'
  chmod-calculator:
    description: '이 온라인 chmod 계산기로 chmod 권한과 명령어를 계산하세요.'
    title: 'chmod 계산기'
  chronometer:
    description: '어떤 것의 경과 시간을 측정합니다. 간단한 크로노미터 기능만 갖춘 크로노미터입니다.'
    title: '크로노미터'
  color-contrast-checker:
    description: 'WCAG 2.1 AA 및 AAA의 텍스트와 UI 컴포넌트 기준에 대해 두 색상의 대비 비율을 확인합니다.'
    title: '색상 대비 검사기'
  color-converter:
    description: '색상을 서로 다른 형식(hex, rgb, hsl, CSS 이름)으로 변환합니다'
    title: '색상 변환기'
  commit-memo:
    description: '예시와 자주 쓰는 도구를 모은 conventional commits 치트시트'
    title: 'Conventional Commit 치트시트'
  common-regex-memo:
    description: '자주 쓰는 정규표현식 패턴 치트시트'
    title: '정규표현식 치트시트'
  crontab-generator:
    description: 'crontab을 검증하고 생성하면서 cron 스케줄을 사람이 읽을 수 있는 설명으로 바꿉니다.'
    title: 'crontab 생성기'
  csr-generator:
    description: '인증서 서명 요청 (CSR) 과 그 키 페어를 생성합니다. SAN에 여러 도메인과 IP 주소를 넣을 수 있습니다.'
    title: 'CSR 생성기'
  css-js-formatter:
    description: 'CSS나 JavaScript 코드를 정리하고 보기 좋게 만듭니다. 들여쓰기 크기, 탭 또는 공백 들여쓰기, 줄바꿈 방식을 선택하세요.'
    title: 'CSS·JavaScript 포맷터'
  csv-to-json:
    description: 'RFC 4180 따옴표 필드, 사용자 지정 구분자, 선택적 머리글, 형식 추론을 지원하며 CSV를 JSON으로 변환합니다.'
    title: 'CSV를 JSON으로 변환'
  data-size-converter:
    description: '바이트, 킬로바이트, 메가바이트, 기가바이트, 테라바이트, 페타바이트 사이에서 데이터 크기를 변환합니다. 10진(SI) 기준과 2진(IEC) 기준을 전환할 수 있습니다.'
    title: '데이터 크기 변환기'
  date-calculator:
    description: '일수를 더하거나 빼고, 두 날짜의 차이를 구하고, 나이를 계산합니다. 모두 달력일 기준으로 계산하므로 일광 절약 시간으로 결과가 어긋나지 않습니다.'
    title: '날짜 계산기'
  date-converter:
    description: '날짜와 시간을 여러 가지 형식으로 변환합니다'
    title: '날짜·시간 변환기'
  device-information:
    description: '현재 기기 정보를 확인합니다(화면 크기, 픽셀 비율, 사용자 에이전트 등).'
    title: '기기 정보'
  dns-query:
    description: '도메인 이름의 A, AAAA, CNAME, MX, TXT, NS, SOA, SRV, PTR, CAA 레코드를 조회합니다.'
    title: 'DNS 레코드 조회'
  dns-record-generator:
    description: '이메일 인증(SPF, DKIM, DMARC, BIMI) 뒤에 있는 TXT 레코드를 만듭니다. 양식을 채우면 DNS 영역에 붙여 넣을 수 있는 레코드 이름과 값을 얻습니다.'
    title: 'DNS 레코드 생성기'
  docker-compose-validator:
    description: 'docker-compose.yml 파일을 검증하고 구문 오류와 의미적 문제를 위치와 권장 수정안과 함께 목록으로 보여줍니다.'
    title: 'Docker Compose 검증기'
  docker-run-to-docker-compose-converter:
    description: '"docker run" 명령을 docker-compose 파일로 변환합니다!'
    title: 'docker run → Docker compose 변환기'
  email-header-parser:
    description: '원본 이메일 헤더를 읽기 쉬운 항목으로 나눕니다. 발신자·수신자 목록, 제목, 날짜, Received 전달 경로, SPF/DKIM/DMARC 결과까지 보여주고, RFC 2047 인코딩 단어를 디코딩하며 접힌 헤더를 펼칩니다.'
    title: '이메일 헤더 파서'
  email-normalizer:
    description: '이메일 주소를 정규화합니다 — 소문자로 바꾸고 Gmail 방식 별칭의 점을 제거하는 등.'
    title: '이메일 정규화 도구'
  emoji-picker:
    description: '이모지를 쉽게 복사하고 붙여넣기 하며, 각 이모지의 유니코드 값과 코드 포인트도 확인할 수 있습니다.'
    title: '이모지 피커'
  encryption:
    description: 'AES, TripleDES, Rabbit, RC4 같은 암호 알고리즘으로 평문을 암호화하고 암호문을 복호화합니다.'
    title: '텍스트 암호화 / 복호화'
  eta-calculator:
    description: 'ETA(예상 도착 시간) 계산기로 작업의 대략적인 종료 시각을 구합니다. 예를 들어 파일 다운로드의 종료 시각과 소요 시간을 계산할 수 있습니다.'
    title: 'ETA 계산기'
  exif-reader:
    description: '이미지의 EXIF 메타데이터를 읽습니다: 카메라 제조사와 모델, 촬영일, 노출 설정, GPS 좌표.'
    title: 'EXIF 리더'
  exif-remover:
    description: 'JPEG, PNG, WebP 파일 안의 메타데이터 세그먼트를 나열하고 원하는 것만 제거합니다 — 이미지 데이터 자체는 바이트 단위로 그대로 복사되며 다시 인코딩되지 않습니다.'
    title: '이미지 메타데이터 제거'
  git-memo:
    description: 'Git은 분산형 버전 관리 소프트웨어입니다. 이 치트시트를 쓰면 자주 쓰는 git 명령어에 빠르게 접근할 수 있습니다.'
    title: 'Git 치트시트'
  har-sanitizer:
    description: 'HAR 파일을 공유하기 전에 토큰, 쿠키 등 민감한 데이터를 제거합니다.'
    title: 'HAR 새니타이저'
  hash-text:
    description: '필요한 함수로 텍스트 문자열을 해시합니다: MD5, SHA1, SHA256, SHA224, SHA512, SHA384, SHA3, RIPEMD160, BLAKE2, BLAKE3, Keccak, xxHash, Adler-32, CRC-32, CRC-32C — 한 번에 전부 계산할 수도 있습니다'
    title: '텍스트 해시'
  hmac-generator:
    description: '비밀 키와 원하는 해시 함수를 사용해 해시 기반 메시지 인증 코드(HMAC)를 계산합니다.'
    title: 'HMAC 생성기'
  html-entities:
    description: 'HTML 엔티티를 이스케이프하거나 해제합니다 (<,>, &, " 및 '' 같은 문자를 HTML 버전으로 바꿉니다).'
    title: 'HTML 엔티티 이스케이프'
  html-to-markdown:
    description: 'HTML을 Markdown으로 변환합니다. 제목, 링크, 목록, 인용, 코드 블록, 이미지뿐 아니라 GFM 표, 취소선, 작업 목록도 처리합니다.'
    title: 'HTML → Markdown'
  html-wysiwyg-editor:
    description: '콘텐츠의 소스 코드를 바로 만들어 주는 온라인 WYSIWYG HTML 편집기입니다.'
    title: 'HTML WYSIWYG 편집기'
  htpasswd:
    description: 'apache2-utils를 설치하지 않고 Apache .htpasswd 줄을 생성하고 검증합니다. docker-compose 환경 변수에 그대로 붙여 넣을 수 있는 `username:hash` 줄을 만들어 줍니다. bcrypt(2.4.4부터 Apache 기본값), apr1 MD5(구 기본값, Windows와 네트워크 공유에서 여전히 흔함), {SHA}, 평문을 지원합니다.'
    title: 'htpasswd 생성기'
  http-status-codes:
    description: '모든 HTTP 상태 코드와 그 이름, 의미를 나열한 목록입니다.'
    title: 'HTTP 상태 코드'
  iana-timezone-index:
    description: 'IANA 시간대 데이터베이스를 검색할 수 있는 색인입니다. 이름, 약어(CST), UTC 오프셋(UTC+8) 중 하나로 시간대를 찾아 현재 오프셋, 표준 오프셋, 서머타임 적용 여부와 현재 현지 시간을 확인하세요.'
    title: 'IANA 시간대 색인'
  iban-validator-and-parser:
    description: 'IBAN 번호를 검증하고 분석합니다. IBAN이 유효한지 확인하고 국가, BBAN, QR-IBAN 여부, 읽기 쉬운 IBAN 형식을 알아낼 수 있습니다.'
    title: 'IBAN 검증 및 분석기'
  ical-generator:
    description: 'RFC 5545 형식의 .ics 캘린더 이벤트를 만듭니다. 시각은 UTC로 기록되어 VTIMEZONE이 필요 없습니다.'
    title: 'iCal 생성기'
  ical-parser:
    description: '.ics 파일을 읽기 쉬운 이벤트 표로 분석합니다. 접힌 줄은 펼치고, 텍스트의 이스케이프는 해제합니다.'
    title: 'iCal 분석기'
  icon-generator:
    description: '이미지 한 장으로 앱 아이콘 세트, PWA 매니페스트, ZIP 압축 파일을 만듭니다.'
    title: '아이콘 생성기'
  integer-to-ip:
    description: '정수를 IPv4 주소, RFC 5952 IPv6 주소, 16진수, 2진수로 변환합니다.'
    title: '정수 → IP'
  ipv4-address-converter:
    description: 'IP 주소를 10진수, 2진수, 16진수, 심지어 IPv6 표현으로 변환합니다.'
    title: 'IPv4 주소 변환기'
  ipv4-range-expander:
    description: '시작과 끝 IPv4 주소를 입력하면 유효한 IPv4 서브넷과 CIDR 표기법을 계산합니다.'
    title: 'IPv4 범위 확장 도구'
  ipv4-subnet-calculator:
    description: 'IPv4 CIDR 블록을 파싱하고 서브넷에 대해 필요한 모든 정보를 확인합니다.'
    title: 'IPv4 서브넷 계산기'
  ipv6-address-converter:
    description: 'IPv6 주소를 확장·압축·10진·16진·2진 형식과 ARPA 역방향 이름, 주소 유형으로 변환합니다.'
    title: 'IPv6 주소 변환기'
  ipv6-subnet-calculator:
    description: 'IPv6 CIDR 블록의 네트워크 주소, 첫 번째와 마지막 호스트, 주소 수, 넷마스크, 와일드카드 마스크를 계산하고 더 작은 서브넷으로 나눕니다.'
    title: 'IPv6 서브넷 계산기'
  ipv6-ula-generator:
    description: 'RFC4193에 따라 네트워크에 사용할 로컬이고 라우팅되지 않는 IP 주소를 직접 생성합니다.'
    title: 'IPv6 ULA 생성기'
  jasypt:
    description: 'Java 프로젝트를 준비하지 않고도 `jasypt-spring-boot`가 application.yml에서 읽어 드리는 `ENC(...)` 값을 암호화하고 복호화합니다. PBEWithMD5AndDES(PBKDF1-MD5 + DES-CBC, Spring Boot 기본값)와 PBEWITHHMACSHA512ANDAES_256(PBKDF2-HMAC-SHA512 + AES-256-CBC)을 지원합니다. 반복 횟수와 솔트 길이는 암호문에 포함되지 않으므로 복호화할 때 둘 다 일치해야 합니다. 여기의 기본값은 Jasypt 자체의 기본값과 같습니다.'
    title: 'Jasypt 문자열 암호화 / 복호화 도구'
  json-diff:
    description: '두 JSON 객체를 비교하고 차이점을 확인합니다.'
    title: 'JSON 차이'
  json-minify:
    description: '불필요한 공백을 지워 JSON을 압축하고 최소화합니다.'
    title: 'JSON 최소화'
  json-prettify:
    description: 'JSON 문자열을 사람이 읽기 좋은 형식으로 정리합니다.'
    title: 'JSON 정리 및 서식 지정'
  json-to-csharp:
    description: 'JSON을 C# 형식 정의(클래스 또는 record)로 변환합니다.'
    title: 'JSON → C#'
  json-to-csv:
    description: '헤더를 자동으로 알아내어 JSON을 CSV로 변환합니다.'
    title: 'JSON을 CSV로'
  json-to-go:
    description: 'JSON을 Go 타입 정의(구조체)로 변환합니다.'
    title: 'JSON에서 Go'
  json-to-toml:
    description: 'JSON을 파싱해 TOML로 변환합니다.'
    title: 'JSON → TOML'
  json-to-xml:
    description: 'JSON 문서를 XML로 변환합니다. 데이터 교환과 API 디버깅에 유용합니다.'
    title: 'JSON → XML'
  json-to-yaml-converter:
    description: '이 온라인 변환기로 JSON을 YAML로 간단히 변환합니다.'
    title: 'JSON을 YAML로 변환'
  jwt-generator:
    description: '서명된 JSON Web Token(HS/RS/PS/ES)을 생성하고 서명을 검증합니다.'
    title: 'JWT 생성기'
  jwt-parser:
    description: 'JSON Web Token(JWT)을 파싱하고 디코딩해 내용을 보여줍니다.'
    title: 'JWT 파서'
  keycode-info:
    description: '누른 키의 JavaScript keycode, code, 위치, 수정자를 확인합니다.'
