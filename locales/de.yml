# de 语言包。
#
# 英文从 `locales/en.yml` 来，这个文件是同结构的其他语言。
# 键没译到的会**逐条**回退到英文（见 src/i18n.rs 的 t()），
# 所以这个文件可以只写一部分 —— 缺的那条显示英文，不会露出键名。
#
# 由 scripts/i18n/merge.py 从 new-tool/i18n/de/ 下的翻译片段合并而成。
#

tools:
  argon2-hash-generator:
    description: 'Hashen und Vergleichen von Textstrings mit Argon2 (argon2id, argon2i oder argon2d), mit einstellbarer Speichergröße, Iterationsanzahl, Parallelität und Hashlänge. Argon2 ist der Gewinner der Password Hashing Competition und die aktuelle Empfehlung zum Speichern von Passwörtern.'
    title: 'Argon2-Hash-Generator'
  ascii-text-drawer:
    description: 'Zeichne ein Wort oder ein paar Zeilen Text als ASCII-Art.'
    title: 'ASCII-Art-Zeichner'
  base-converter:
    description: 'Konvertiere Zahlen zwischen verschiedenen Basen (Dezimal, Hexadezimal, Binär, Oktal, Base64, ...).'
    title: 'Ganzzahl-Basiskonverter'
  base64-file-converter:
    description: 'Konvertiere Strings, Dateien oder Bilder in ihre Base64-Repräsentation.'
    title: 'Base64-Dateikonverter'
  base64-string-converter:
    description: 'Codiere und decodiere Strings einfach in ihre Base64-Repräsentation.'
    title: 'Base64-String-Encoder/Decoder'
  basic-auth-generator:
    description: 'Generiere einen Base64-Basic-Auth-Header aus einem Benutzernamen und einem Passwort.'
    title: 'Basic-Auth-Generator'
  bcrypt:
    description: 'Hashen und Vergleichen von Strings mit bcrypt. Bcrypt ist eine auf der Blowfish-Chiffre basierende Hash-Funktion.'
    title: 'Bcrypt'
  benchmark-builder:
    description: 'Vergleiche ganz einfach die Ausführungszeit von Aufgaben mit diesem sehr einfachen Online-Benchmark-Builder.'
    title: 'Benchmark-Builder'
  bip39-generator:
    description: 'Generiere BIP39-Passphrasen aus vorhandener oder zufälliger Mnemonik oder erhalte die Mnemonik aus der Passphrase.'
    title: 'BIP39-Passphrasengenerator'
  camera-recorder:
    description: 'Mache ein Foto oder nimm ein Video von deiner Webcam oder Kamera auf.'
    title: 'Kamera-Rekorder'
  case-converter:
    description: 'Ändere die Groß-/Kleinschreibung eines Strings und wähle zwischen verschiedenen Formaten aus.'
    title: 'Groß-/Kleinschreibung'
  categories:
    converter: 'Konvertierung'
    crypto: 'Kryptografie'
    data: 'Daten'
    development: 'Entwicklung'
    'images and videos': 'Bilder & Videos'
    math: 'Mathematik'
    measurement: 'Messtechnik'
    network: 'Netzwerk'
    text: 'Text'
    web: 'Web'
  chinese-number-converter:
    description: 'Konvertiere zwischen chinesischen und arabischen Ziffern. Unterstützt Großbuchstaben-Ziffern (壹贰叁), einfache Ziffern, RMB-Beträge und traditionelle Zeichenvarianten.'
    title: 'Chinesischer Zahlenkonverter'
  chmod-calculator:
    description: 'Berechne deine Chmod-Berechtigungen und -Befehle mit diesem Online-Chmod-Rechner.'
    title: 'Chmod-Rechner'
  chronometer:
    description: 'Überwache die Dauer einer Sache. Im Grunde ein Chronometer mit einfachen Chronometerfunktionen.'
    title: 'Chronometer'
  color-contrast-checker:
    description: 'Prüfe das Kontrastverhältnis von zwei Farben anhand der WCAG 2.1 Schwellenwerte für Text (AA und AAA) und UI-Komponenten.'
    title: 'Farbkontrastprüfer'
  color-converter:
    description: 'Konvertiere Farben zwischen den verschiedenen Formaten (Hex, RGB, HSL und CSS-Name).'
    title: 'Farbkonverter'
  commit-memo:
    description: 'Spickzettel für Conventional Commits mit Beispielen und gängigen Tools'
    title: 'Conventional-Commit-Spickzettel'
  common-regex-memo:
    description: 'Spickzettel für gängige Regex-Muster'
    title: 'Regex-Spickzettel'
  crontab-generator:
    description: 'Überprüfe und generiere Crontab und erhalte die menschenlesbare Beschreibung des Cron-Zeitplans.'
    title: 'Crontab-Generator'
  csr-generator:
    description: 'Erzeuge einen Certificate Signing Request (CSR) mit seinem Schlüsselpaar, inklusive mehrerer Domains und IP-Adressen im SAN.'
    title: 'CSR-Generator'
  css-js-formatter:
    description: 'Formatiere und verschönere CSS- oder JavaScript-Code. Wähle die Einrückungsgröße, Tabulator- oder Leerzeicheneinzug und den Zeilenabschluss.'
    title: 'CSS- und JavaScript-Formatierer'
  csv-to-json:
    description: 'Konvertiere CSV mit RFC-4180-Feldern in Anführungszeichen, eigenen Trennzeichen, optionalen Kopfzeilen und Typinferenz zu JSON.'
    title: 'CSV zu JSON'
  data-size-converter:
    description: 'Konvertiere Datengrößen zwischen Bytes, Kilobytes, Megabytes, Gigabytes, Terabytes und Petabytes, mit umschaltbarer dezimaler (SI) und binärer (IEC) Basis.'
    title: 'Datengrößen-Konverter'
  date-calculator:
    description: 'Tage addieren oder abziehen, die Differenz zwischen zwei Daten berechnen und ein Alter ermitteln – alles auf Basis des Kalendertages, sodass die Sommerzeit kein Ergebnis verschiebt.'
    title: 'Datumsrechner'
  date-converter:
    description: 'Konvertiere Datum und Uhrzeit in verschiedene Formate.'
    title: 'Datum-Uhrzeit-Konverter'
  device-information:
    description: 'Informationen zu deinem aktuellen Gerät (Bildschirmgröße, Pixelverhältnis, Benutzeragent, ...) erhalten.'
    title: 'Geräteinformationen'
  dns-query:
    description: 'Frage A-, AAAA-, CNAME-, MX-, TXT-, NS-, SOA-, SRV-, PTR- und CAA-Records für einen Domainnamen ab.'
    title: 'DNS-Record-Suche'
  dns-record-generator:
    description: 'Erstelle die TXT-Records hinter der E-Mail-Authentifizierung – SPF, DKIM, DMARC und BIMI. Fülle das Formular aus und erhalte den Record-Namen und -Wert zum Einfügen in deine DNS-Zone.'
    title: 'DNS-Record-Generator'
  docker-compose-validator:
    description: 'Validiere eine docker-compose.yml-Datei und liste ihre Syntaxfehler und semantischen Probleme mit Ort und Lösungsvorschlag.'
    title: 'Docker-Compose-Validator'
  docker-run-to-docker-compose-converter:
    description: 'Wandle docker run-Befehle in docker-compose-Dateien um!'
    title: 'Docker run zu Docker compose Konverter'
  email-header-parser:
    description: 'Rohemail-Header in lesbare Abschnitte zerlegen — Absender-/Empfängerliste, Betreff, Datum, Received-Zustellpfad und SPF/DKIM/DMARC-Ergebnisse. RFC-2047-kodierte Wörter werden dekodiert, umgebrochene Header werden entfaltet.'
    title: 'E-Mail-Header-Parser'
  email-normalizer:
    description: 'Normalisiere eine E-Mail-Adresse — kleinschreiben, Punkte aus Gmail-Aliassen entfernen und mehr.'
    title: 'E-Mail-Normalisierer'
  emoji-picker:
    description: 'Einfaches Kopieren und Einfügen von Emojis. Erhalte außerdem den Unicode- und Codepunkt-Wert jedes Emojis.'
    title: 'Emoji-Picker'
  encryption:
    description: 'Verschlüssele und entschlüssele Klartext mithilfe von Kryptoalgorithmen wie AES, TripleDES, Rabbit oder RC4.'
    title: 'Text verschlüsseln / entschlüsseln'
  eta-calculator:
    description: 'Ein ETA (Estimated Time of Arrival)-Rechner, um die ungefähre Endzeit einer Aufgabe zu erfahren, z. B. den Zeitpunkt des Endes eines Downloads.'
    title: 'ETA-Rechner'
  exif-reader:
    description: 'Lese die EXIF-Metadaten eines Bildes: Kameramarke und -modell, Aufnahmedatum, Belichtungseinstellungen und GPS-Koordinaten.'
    title: 'EXIF-Reader'
  exif-remover:
    description: 'Liste die Metadaten-Segmente in einem JPEG, PNG oder WebP auf und entferne die von dir gewählten — die Bilddaten selbst werden byteweise kopiert und nie neu kodiert.'
    title: 'Bildmetadaten entfernen'
  git-memo:
    description: 'Git ist eine dezentrale Versionsverwaltungssoftware. Mit diesem Spickzettel hast du schnellen Zugriff auf die gängigsten Git-Befehle.'
    title: 'Git-Spickzettel'
  har-sanitizer:
    description: 'Entferne Tokens, Cookies und andere sensible Daten aus einer HAR-Datei, bevor du sie teilst.'
    title: 'HAR-Bereiniger'
  hash-text:
    description: 'Hashe einen Text-String mit der von dir benötigten Funktion: MD5, SHA1, SHA256, SHA224, SHA512, SHA384, SHA3, RIPEMD160, BLAKE2, BLAKE3, Keccak, xxHash, Adler-32, CRC-32, CRC-32C — oder mit allen auf einmal'
    title: 'Text hashen'
  hmac-generator:
    description: 'Berechnet einen hashbasierten Nachrichtenauthentifizierungscode (HMAC) unter Verwendung eines geheimen Schlüssels und deiner bevorzugten Hash-Funktion.'
    title: 'HMAC-Generator'
  html-entities:
    description: 'Escape oder Unescape von HTML-Entitäten (ersetze <, >, &, " und '' durch ihre HTML-Version).'
    title: 'HTML-Entity-Escape'
  html-to-markdown:
    description: 'Konvertiere HTML zu Markdown. Verarbeitet Überschriften, Links, Listen, Zitate, Codeblöcke und Bilder sowie GFM-Tabellen, Durchgestrichenes und Aufgabenlisten.'
    title: 'HTML zu Markdown'
  html-wysiwyg-editor:
    description: 'Online-HTML-Editor mit funktionsreichem WYSIWYG-Editor, erhalte sofort den Quellcode des Inhalts.'
    title: 'HTML-WYSIWYG-Editor'
  htpasswd:
    description: 'Erzeuge und prüfe Apache-.htpasswd-Zeilen, ohne apache2-utils zu installieren. Erzeugt eine `username:hash`-Zeile, die du direkt in eine docker-compose-Umgebungsvariable einfügen kannst. Unterstützt bcrypt (der Apache-Standard seit 2.4.4), apr1-MD5 (der alte Standard, weiterhin häufig unter Windows und in Netzwerkfreigaben), {SHA} und Klartext.'
    title: 'htpasswd-Generator'
  http-status-codes:
    description: 'Liste aller HTTP-Statuscodes, ihrer Namen und ihrer Bedeutung.'
    title: 'HTTP-Statuscodes'
  iana-timezone-index:
    description: 'Durchsuchbare Übersicht der IANA-Zeitzonendatenbank. Suche eine Zone nach Name, nach ihrer Abkürzung (CST) oder nach dem UTC-Offset (UTC+8) und sieh den aktuellen Offset, den Standardoffset, ob gerade Sommerzeit gilt und die örtliche Zeit.'
    title: 'IANA-Zeitzonen-Index'
  iban-validator-and-parser:
    description: 'Validiere und parse IBAN-Nummern. Überprüfe, ob die IBAN gültig ist, und erhalte das Land, BBAN, ob es sich um eine QR-IBAN handelt und das IBAN-freundliche Format.'
    title: 'IBAN-Validator und -Parser'
  ical-generator:
    description: 'Erstelle einen RFC-5545-.ics-Kalendereintrag mit Zeiten in UTC und ohne VTIMEZONE.'
    title: 'iCal-Generator'
  ical-parser:
    description: 'Parse eine .ics-Datei in eine lesbare Tabelle mit Terminen, wobei gefaltete Zeilen ausgeklappt und Texte entschärft werden.'
    title: 'iCal-Parser'
  icon-generator:
    description: 'Erzeuge App-Icon-Sets, ein PWA-Manifest und ein ZIP-Archiv aus einem einzigen Bild.'
    title: 'Icon-Generator'
  integer-to-ip:
    description: 'Konvertiere eine Ganzzahl in eine IPv4-Adresse, eine IPv6-Adresse nach RFC 5952, Hexadezimal und Binär.'
    title: 'Ganzzahl zu IP'
  ipv4-address-converter:
    description: 'Konvertiere eine IP-Adresse in Dezimal, Binär, Hexadezimal oder sogar in IPv6.'
    title: 'IPv4-Adresskonverter'
  ipv4-range-expander:
    description: 'Bei Angabe einer Start- und End-IPv4-Adresse berechnet dieses Tool ein gültiges IPv4-Netzwerk mit seiner CIDR-Notation.'
    title: 'IPv4-Bereichserweiterer'
  ipv4-subnet-calculator:
    description: 'Parse deine IPv4-CIDR-Blöcke und erhalte alle Informationen, die du über dein Subnetz benötigst.'
    title: 'IPv4-Subnetzrechner'
  ipv6-address-converter:
    description: 'Konvertiere eine IPv6-Adresse in ihre ausgeschriebene, komprimierte, dezimale, hexadezimale und binäre Form sowie in den ARPA-Reverse-Namen und den Adresstyp.'
    title: 'IPv6-Adresskonverter'
  ipv6-subnet-calculator:
    description: 'Berechne Netzwerkadresse, ersten und letzten Host, Adressanzahl, Netzmaske und Wildcard-Maske eines IPv6-CIDR-Blocks und teile ihn in kleinere Subnetze auf.'
    title: 'IPv6-Subnetzrechner'
  ipv6-ula-generator:
    description: 'Generiere deine eigenen lokalen, nicht routbaren IP-Adressen in deinem Netzwerk gemäß RFC4193.'
    title: 'IPv6-ULA-Generator'
  jasypt:
    description: 'Verschlüssele und entschlüssele die `ENC(...)`-Werte, die `jasypt-spring-boot` aus application.yml liest, ganz ohne Java-Projekt. Unterstützt PBEWithMD5AndDES (PBKDF1-MD5 + DES-CBC, der Spring-Boot-Standard) und PBEWITHHMACSHA512ANDAES_256 (PBKDF2-HMAC-SHA512 + AES-256-CBC). Iterationsanzahl und Saltlänge werden nicht in den Chiffretext codiert, beim Entschlüsseln müssen beide übereinstimmen; die Vorgaben hier sind dieselben wie in Jasypt selbst.'
    title: 'Jasypt-String-Encryptor / -Decryptor'
  json-diff:
    description: 'Vergleiche zwei JSON-Objekte und erhalte die Unterschiede zwischen ihnen.'
    title: 'JSON-Unterschied'
  json-minify:
    description: 'Minifiziere und komprimiere dein JSON, indem unnötige Leerzeichen entfernt werden.'
    title: 'JSON minifizieren'
  json-prettify:
    description: 'Verschönere deinen JSON-String in ein menschenlesbares Format.'
    title: 'JSON verschönern und formatieren'
  json-to-csharp:
    description: 'Konvertiere JSON in C#-Typdefinitionen (Klassen oder Records).'
    title: 'JSON zu C#'
  json-to-csv:
    description: 'Konvertiere JSON mit automatischer Headererkennung in CSV.'
    title: 'JSON zu CSV'
  json-to-go:
    description: 'Konvertiere JSON in Go-Typdefinitionen (Structs).'
    title: 'JSON zu Go'
  json-to-toml:
    description: 'Parse und konvertiere JSON zu TOML.'
    title: 'JSON zu TOML'
  json-to-xml:
    description: 'Konvertiere JSON-Dokumente in XML. Praktisch für den Datenaustausch und zum Debuggen von APIs.'
    title: 'JSON zu XML'
  json-to-yaml-converter:
    description: 'Konvertiere JSON einfach in YAML mit diesem Live-Online-Konverter.'
    title: 'JSON zu YAML'
  jwt-generator:
    description: 'Generiere einen signierten JSON Web Token (HS/RS/PS/ES) und überprüfe seine Signatur.'
    title: 'JWT-Generator'
  jwt-parser:
    description: 'Parse und decodiere deinen JSON-Web-Token (JWT) und zeige dessen Inhalt an.'
    title: 'JWT-Parser'
  keycode-info:
    description: 'Finde den JavaScript-Keycode, den Code, den Standort und die Modifikatoren einer beliebigen gedrückten Taste.'
    title: 'Keycode-Info'
  list-converter:
    description: 'Dieses Tool kann spaltenbasierte Daten verarbeiten und verschiedene Änderungen (transponieren, Präfix und Suffix hinzufügen, Liste umkehren, Liste sortieren, Werte in Kleinbuchstaben umwandeln, Werte abschneiden) auf jede Zeile anwenden.'
    title: 'Listenkonverter'
  lorem-ipsum-generator:
    description: 'Lorem Ipsum ist ein Platzhaltertext, der häufig verwendet wird, um die visuelle Form eines Dokuments oder einer Schriftart ohne Verwendung von bedeutendem Inhalt zu demonstrieren.'
    title: 'Lorem Ipsum Generator'
  mac-address-generator:
    description: 'Gebe die Menge und das Präfix ein. MAC-Adressen werden in deiner gewählten Schreibweise (Groß- oder Kleinbuchstaben) generiert.'
    title: 'MAC-Adressen-Generator'
  mac-address-lookup:
    description: 'Finde den Anbieter und Hersteller eines Geräts anhand seiner MAC-Adresse.'
    title: 'MAC-Adressensuche'
  markdown-cheatsheet:
    description: 'Markdown-Spickzettel'
    title: 'Markdown-Spickzettel'
  markdown-table-formatter:
    description: 'Richte die Spalten einer Markdown-Tabelle aus: Jede Spalte wird bis zu ihrer breitesten Zelle aufgefüllt, die Trennzeile entsprechend neu aufgebaut und die Ausrichtungsmarkierungen bleiben erhalten.'
    title: 'Markdown-Tabellenformatierer'
  markdown-table-generator:
    description: 'Erstelle eine GitHub-kompatible Markdown-Tabelle in einem visuellen Editor: Zeilen und Spalten hinzufügen oder entfernen, die Ausrichtung jeder Spalte festlegen und das Ergebnis kopieren.'
    title: 'Markdown-Tabellengenerator'
  markdown-to-html:
    description: 'Wandle Markdown-Text in HTML um, das du direkt in eine Seite, eine E-Mail oder ein Dokument einfügen kannst.'
    title: 'Markdown zu HTML'
  math-evaluator:
    description: 'Ein Taschenrechner zum Auswerten mathematischer Ausdrücke. Du kannst Funktionen wie sqrt, cos, sin, abs usw. verwenden.'
    title: 'Mathematischer Auswerter'
  mime-types:
    description: 'Konvertiere MIME-Typen in Erweiterungen und umgekehrt.'
    title: 'MIME-Typen'
  morse-code:
    description: 'Kodiere Text in Morsecode und dekodiere Morsecode zurück in Text.'
    title: 'Morsecode-Konverter'
  nano-memo:
    description: 'Spickzettel für den Nano-Editor'
    title: 'Nano-Spickzettel'
  numeronym-generator:
    description: 'Ein Numeronym ist ein Wort, bei dem eine Zahl verwendet wird, um eine Abkürzung zu bilden. Zum Beispiel ist "i18n" ein Numeronym für "internationalization", wobei 18 für die Anzahl der Buchstaben zwischen dem ersten "i" und dem letzten "n" im Wort steht.'
    title: 'Numeronym-Generator'
  object-id:
    description: 'Erzeuge MongoDB-ObjectIds und sieh dir ihre Struktur an (Zeitstempel, Zufallswert, Zähler). Das Werkzeug date-time-converter wandelt Daten bereits in beide Richtungen ins mongo-objectid-Format um, dieses hier deckt dagegen Erzeugung und strukturelle Aufschlüsselung ab.'
    title: 'MongoDB ObjectId'
  og-meta-generator:
    description: 'Generiere Open Graph- und Social-HTML-Metatags für deine Website.'
    title: 'Open Graph Meta-Generator'
  otp-generator:
    description: 'Generiere und validiere zeitbasierte und ereignisbasierte OTPs (Einmalpasswörter) für die Multi-Faktor-Authentifizierung.'
    title: 'OTP-Code-Generator'
  password-strength-analyser:
    description: 'Ermittle die Stärke deines Passworts mit diesem Client-seitigen Passwortstärken-Analysator und Tool zur Schätzung der Knackzeit.'
    title: 'Passwortstärken-Analysator'
  pdf-signature-checker:
    description: 'Überprüfe die Signaturen einer PDF-Datei. Eine signierte PDF-Datei enthält eine oder mehrere Signaturen, die verwendet werden können, um festzustellen, ob der Inhalt der Datei seit dem Zeitpunkt der Signierung geändert wurde.'
    title: 'PDF-Signaturprüfer'
  percentage-calculator:
    description: 'Berechne einfach Prozentsätze von einem Wert zu einem anderen Wert oder von einem Prozentsatz zu einem Wert.'
    title: 'Prozentrechner'
  phone-parser-and-formatter:
    description: 'Parse, validiere und formatiere Telefonnummern. Erhalte Informationen zur Telefonnummer, wie z. B. die Landesvorwahl, den Typ usw.'
    title: 'Telefonnummer-Parser und -Formatter'
  punycode-converter:
    description: 'Konvertiere internationalisierte Domainnamen oder E-Mail-Adressen zu und von ASCII-Punycode (RFC 3492).'
    title: 'Punycode-Konverter'
  qrcode-generator:
    description: 'Generiere und downloade QR-Codes für eine URL oder einfach einen Text und passe die Hintergrund- und Vordergrundfarben an.'
    title: 'QR-Code-Generator'
  random-port-generator:
    description: 'Generiere zufällige Portnummern außerhalb des Bereichs der "bekannten" Ports (0-1023).'
    title: 'Zufälliger Port-Generator'
  regex-memo:
    description: 'Ein Spickzettel der gängigsten regulären Ausdrücke.'
    title: 'Regex-Spickzettel'
  regex-tester:
    description: 'Schreibe einen regulären Ausdruck und teste ihn live an einem Beispielstring.'
    title: 'Regex-Tester'
  roman-numeral-converter:
    description: 'Konvertiere römische Zahlen in Dezimalzahlen und Dezimalzahlen in römische Zahlen.'
    title: 'Römische Zahlen Konverter'
  rsa-key-pair-generator:
    description: 'Generiere neue zufällige RSA-Private- und Public-Key-PEM-Zertifikate.'
    title: 'RSA-Schlüsselpaar-Generator'
  safelink-decoder:
    description: 'Dekodiere Outlook SafeLinks, um die URL zu enthüllen, auf die sie tatsächlich zeigen.'
    title: 'SafeLinks-Decoder'
  slugify-string:
    description: 'Mache einen String URL-, Dateinamen- und ID-sicher.'
    title: 'Slugify String'
  sql-prettify:
    description: 'Formatiere und verschönere deine SQL-Abfragen online (unterstützt verschiedene SQL-Dialekte).'
    title: 'SQL verschönern und formatieren'
  ssh-key-pair-generator:
    description: 'Erzeuge ein SSH-Schlüsselpaar im OpenSSH-Format (ed25519, ECDSA P-256 oder RSA), optional mit Passphrase, dazu die passende authorized_keys-Zeile und den SHA256-Fingerabdruck.'
    title: 'SSH-Schlüsselpaar-Generator'
  ssl-certificate-decoder:
    description: 'Dekodiere ein X.509-Zertifikat und zeige Subject, Aussteller, Gültigkeitszeitraum, öffentlichen Schlüssel, SAN-Einträge und Fingerabdrücke. Akzeptiert PEM, Base64 oder DER in Hexadezimal — eine ganze Zertifikatskette kann auf einmal eingefügt werden.'
    title: 'SSL-Zertifikat-Dekoder'
  stacktrace-formatter:
    description: 'Parse einen Stacktrace (V8, Firefox, Java, Python, .NET) in Frames und kopiere ihn als ausgerichteten Text oder hervorgehobenes HTML.'
    title: 'Stacktrace-Formatter'
  string-obfuscator:
    description: 'Verschleiere einen String (wie ein Secret, eine IBAN oder ein Token), um ihn weitergeben zu können und identifizierbar zu machen, ohne seinen Inhalt preiszugeben.'
    title: 'String-Verschleierer'
  svg-placeholder-generator:
    description: 'Generiere SVG-Bilder, die als Platzhalter in deinen Anwendungen verwendet werden können.'
    title: 'SVG-Platzhalter-Generator'
  temperature-converter:
    description: 'Temperaturgradumrechnungen für Kelvin, Celsius, Fahrenheit, Rankine, Delisle, Newton, Réaumur und Rømer.'
    title: 'Temperaturkonverter'
  text-diff:
    description: 'Vergleiche zwei Texte und sieh die Unterschiede zwischen ihnen.'
    title: 'Textunterschied'
  text-statistics:
    description: 'Informationen zu einem Text erhalten, wie die Anzahl der Zeichen, die Anzahl der Wörter, die Größe usw.'
    title: 'Textstatistiken'
  text-to-binary:
    description: 'Konvertiere Text in seine UTF-8-Binärrepräsentation und umgekehrt.'
    title: 'Text zu UTF-8-Binär'
  text-to-nato-alphabet:
    description: 'Wandle Text in das NATO-Phonetik-Alphabet für die mündliche Übermittlung um. Unterstützt außerdem die deutsche (DIN 5008), französische, spanische und russische Buchstabiertafel.'
    title: 'Text zu NATO-Alphabet'
  text-to-unicode:
    description: 'Parse und konvertiere Text in Unicode und umgekehrt'
    title: 'Text zu Unicode'
  token-generator:
    description: 'Generiere eine zufällige Zeichenfolge mit den von dir gewünschten Zeichen, Groß- oder Kleinbuchstaben, Zahlen und/oder Symbolen.'
    title: 'Token-Generator'
  toml-to-json:
    description: 'Parse und konvertiere TOML zu JSON.'
    title: 'TOML zu JSON'
  toml-to-yaml:
    description: 'Parse und konvertiere TOML zu YAML.'
    title: 'TOML zu YAML'
  ulid-generator:
    description: 'Generiere zufällige Universally Unique Lexicographically Sortable Identifier (ULID).'
    title: 'ULID-Generator'
  unit-converter:
    description: 'Konvertiere Werte zwischen Einheiten für Länge, Masse, Fläche, Volumen, Zeit, Geschwindigkeit, Winkel, Druck, Energie, Leistung, Kraft und Datengröße.'
    title: 'Einheitenkonverter'
  url-encoder:
    description: 'Kodiere zum URL-kodierten Format (auch als "prozentkodiert" bekannt) oder decodiere es.'
    title: 'Kodieren/Decodieren von URL-formatierten Zeichenfolgen'
  url-parser:
    description: 'Parse eine URL-Zeichenfolge, um alle verschiedenen Teile (Protokoll, Ursprung, Parameter, Port, Benutzername-Passwort usw.) zu erhalten.'
    title: 'URL-Parser'
  user-agent-parser:
    description: 'Erkenne und parse Browser, Engine, Betriebssystem, CPU und Gerätetyp/-modell aus einer User-Agent-Zeichenfolge.'
    title: 'User-Agent-Parser'
  uuid-generator:
    description: 'Ein Universally Unique Identifier (UUID) ist eine 128-Bit-Nummer, die zur Identifizierung von Informationen in Computersystemen verwendet wird. Die Anzahl der möglichen UUIDs beträgt 16^32, was 2^128 oder etwa 3,4x10^38 entspricht (was ziemlich viel ist!).'
    title: 'UUID-Generator'
  uuid-parser:
    description: 'Parse UUIDs und zeige Version, Variante, Zeitstempel, Taktsequenz, Knotenkennung und die Microsoft-GUID-Form.'
    title: 'UUID-Parser'
  week-number-converter:
    description: 'Konvertiere zwischen Datumsangaben, ISO-Wochennummern und der Woche im Monat. Die Woche beginnt am Montag; Woche 1 eines Monats ist die Woche, die den 1. enthält.'
    title: 'Wochennummern-Konverter'
  wifi-qrcode-generator:
    description: 'Generiere und lade QR-Codes für schnelle Verbindungen zu WLAN-Netzwerken herunter.'
    title: 'WLAN-QR-Code-Generator'
  x509-certificate-generator:
    description: 'Erzeuge ein selbstsigniertes X.509-Zertifikat und den zugehörigen privaten Schlüssel, mit mehreren Domains und IP-Adressen im SAN.'
    title: 'X.509-Zertifikatsgenerator'
  xml-diff:
    description: 'Vergleiche zwei XML-Dokumente und hebe die Unterschiede hervor.'
    title: 'XML-Unterschied'
  xml-formatter:
    description: 'Verschönere deinen XML-String in ein menschenlesbares Format.'
    title: 'XML-Formatter'
  xml-to-json:
    description: 'Konvertiere XML-Dokumente in JSON. Praktisch für den Datenaustausch und zum Debuggen von APIs.'
    title: 'XML zu JSON'
  yaml-prettify:
    description: 'Verschönere deinen YAML-String in ein menschenlesbares Format.'
    title: 'YAML verschönern und formatieren'
  yaml-to-json-converter:
    description: 'Konvertiere YAML einfach in JSON mit diesem Live-Online-Konverter.'
    title: 'YAML zu JSON'
  yaml-to-toml:
    description: 'Parse und konvertiere YAML zu TOML.'
    title: 'YAML zu TOML'

