tools:
  categories:
    crypto: '加密'
    converter: '转换器'
    web: Web
    images and videos: '图片和视频'
    development: '开发'
    network: '网络'
    math: '数学'
    measurement: '测量'
    text: '文本'
    data: '数据'


  # 参考项目的语言包最后同步于这 8 个工具之前，缺少条目，这里补齐。
  xml-to-json:
    title: XML 转 JSON
    description: 把 XML 文档转换成 JSON，便于数据交换与接口调试。

  json-to-xml:
    title: JSON 转 XML
    description: 把 JSON 文档转换成 XML，便于数据交换与接口调试。

  markdown-to-html:
    title: Markdown 转 HTML
    description: 把 Markdown 文本转成 HTML，可直接粘贴到网页、邮件或文档里。

  safelink-decoder:
    title: SafeLinks 解码
    description: 解码 Outlook 的 SafeLinks 链接，看出它真正指向的地址。

  email-normalizer:
    title: 邮箱地址规范化
    description: 规范化邮箱地址：转小写、去掉 Gmail 别名里的点号等。

  email-header-parser:
    title: 邮件头解析
    description: 把原始邮件头拆成看得懂的几块：收发件人、主题、日期、Received 投递路径，以及 SPF/DKIM/DMARC 认证结果。自动解开 RFC 2047 编码字并展开折行。

  regex-tester:
    title: 正则表达式测试
    description: 编写正则表达式，用样例字符串实时验证匹配结果。

  regex-memo:
    title: 正则表达式速查表
    description: 最常用的正则表达式语法速查表。

  ascii-text-drawer:
    title: ASCII 字符画生成
    description: 把单词或几行文字渲染成 ASCII 字符画。

  password-strength-analyser:
    title: 密码强度分析仪
    description: 使用此密码强度分析器和破解时间估计工具来发现密码的强度。

  chronometer:
    title: 计时器
    description: 监控事物的持续时间。基本上是一种具有简单计时器功能的计时器。
  token-generator:
    title: 'Token 生成器'
    description: 使用您想要的字符、大写或小写字母、数字和/或符号生成随机字符串。
  percentage-calculator:
    title: 百分比计算器
    description: 轻松计算从一个值到另一个值的百分比，或从百分比到值的百分比。

  svg-placeholder-generator:
    title: SVG 占位符生成器
    description: 生成 svg 图像以用作应用程序中的占位符。

  json-to-csv:
    title: JSON 转 CSV
    description: 使用自动标头检测将JSON转换为CSV。

  camera-recorder:
    title: 摄像机记录器
    description: 从网络摄像头或照相机拍摄照片或录制视频。

  keycode-info:
    title: Keycode 信息
    description: 查找任何按下的键的javascript键代码、代码、位置和修饰符。

  emoji-picker:
    title: Emoji 选择器
    description: 轻松复制和粘贴Emoji表情符号，并获得每个表情符号的unicode和code points值.

  color-converter:
    title: Color 选择器
    description: 在不同格式（十六进制、rgb、hsl和css名称）之间转换颜色
  bcrypt:
    title: 加密
    description: 使用bcrypt对文本字符串进行哈希和比较。Bcrypt是一个基于Blowfish密码的密码哈希函数。

  argon2-hash-generator:
    title: Argon2 哈希生成
    description: 使用 Argon2（argon2id、argon2i 或 argon2d）对文本进行哈希与比对，内存大小、迭代次数、并行度与摘要长度均可调。Argon2 是密码哈希竞赛的冠军，也是目前存储密码的推荐方案。

  crontab-generator:
    title: Crontab 表达式生成
    description: 验证并生成crontab，并获取cron调度的可读描述。

  http-status-codes:
    title: HTTP 状态码
    description: 所有HTTP状态的列表对其名称和含义解释。

  sql-prettify:
    title: SQL 美化和格式化
    description: 在线格式化和美化您的 SQL 查询（它支持各种 SQL 方言）。

  benchmark-builder:
    title: 基准生成器
    description: 简单的在线基准构建器可以轻松比较任务的执行时间。

  git-memo:
    title: Git 备忘录
    description: Git是一种去中心化的版本管理软件。使用此备忘单，您可以快速访问最常见的git命令.

  slugify-string:
    title: 打乱字符串
    description: 确保字符串 url、文件名和 id 安全。

  encryption:
    title: 加密/解密文本
    description: 使用加密算法（如AES、TripleDES、Rabbit或RC4）加密和解密文本明文。

  random-port-generator:
    title: 随机端口生成
    description: 生成“已知”端口范围（0-1023）之外的随机端口号。

  yaml-prettify:
    title: YAML美化和格式化
    description: 将YAML字符串修饰为友好的可读格式。

  eta-calculator:
    title: ETA 计算器
    description: ETA（估计到达时间）计算器，用于知道任务的近似结束时间，例如下载的结束时刻。

  roman-numeral-converter:
    title: 罗马数字转换器
    description: 将罗马数字转换为数字，并将数字转换为罗马数字。

  hmac-generator:
    title: Hmac 生成器
    description: 使用密钥和您喜欢的哈希函数计算基于哈希的消息身份验证代码（HMAC）。

  bip39-generator:
    title: BIP39密码生成器
    description: 从现有或随机助记符生成BIP39密码短语，或从密码短语获取助记符。

  base64-file-converter:
    title: Base64 文件转换器
    description: 将字符串、文件或图像转换为其 Base64 表示形式。
  list-converter:
    title: List 转换器
    description: 该工具可以处理基于数组的数据，并将各种更改（转置、添加前缀和后缀、反向列表、排序列表、小写值、截断值）应用于每一行。

  base64-string-converter:
    title: Base64 字符串编码/解码
    description: 将字符串编码和解码为其 Base64 格式表示形式即可。

  toml-to-yaml:
    title: TOML 到 YAML
    description: Parse and convert TOML to YAML.

  math-evaluator:
    title: 数学计算器
    description: 计算数学表达式的计算器。您可以使用sqrt、cos、sin、abs等函数。

  json-to-yaml-converter:
    title: JSON到YAML转换器
    description: 在线转换将JSON转换为YAML。

  url-parser:
    title: Url分析器
    description: 解析url字符串以获取所有不同的部分（协议、来源、参数、端口、用户名密码…）

  iban-validator-and-parser:
    title: IBAN验证器和解析器
    description: 验证和分析IBAN编号。检查IBAN是否有效，并获取国家BBAN，如果它是QR-IBAN和IBAN友好格式。

  user-agent-parser:
    title: 用户代理分析器
    description: 从用户代理字符串中检测和分析浏览器、引擎、操作系统、CPU和设备类型/型号。

  numeronym-generator:
    title: 数字名称生成器
    description: 数字名是一个用数字构成缩写的词。例如，“i18n”是“国际化”的名词，其中18表示单词中第一个i和最后一个n之间的字母数。

  case-converter:
    title: 大小写转换
    description: 更改字符串的大小写并在不同格式之间进行选择

  html-entities:
    title: 转义html实体
    description: 转义或unescape html实体（将<、>、&、“和\'替换为其html版本）

  json-prettify:
    title: JSON美化和格式化
    description: 将JSON字符串修饰为友好的可读格式。

  docker-run-to-docker-compose-converter:
    title: Docker Run 到 docker-compose 转换器
    description: 将 docker run 命令行转换为 docker-compose 文件!

  mac-address-lookup:
    title: MAC地址查找
    description: 通过设备的MAC地址查找设备的供应商和制造商。

  mime-types:
    title: mime类型
    description: 将mime类型转换为扩展，反之亦然。

  toml-to-json:
    title: TOML 到 JSON
    description: 解析TOML并将其转换为JSON。

  lorem-ipsum-generator:
    title: Lorem ipsum生成器
    description: Lorem ipsum是一种占位符文本，通常用于演示文档或字体的视觉形式，而不依赖于有意义的内容

  qrcode-generator:
    title: 二维码生成器
    description: 生成并下载url或文本的QR代码，并自定义背景和前景颜色。

  wifi-qrcode-generator:
    title: WiFi 二维码生成器
    description: 生成和下载QR码以快速连接到WiFi网络。

  xml-formatter:
    title: XML 格式化
    description: 将XML字符串修饰为友好的可读格式。

  temperature-converter:
    title: 温度转换器
    description: 开尔文、摄氏度、华氏度、兰金、德莱尔、牛顿、雷奥穆尔和罗默温度度数转换。

  chmod-calculator:
    title: Chmod 计算器
    description: 使用此在线的chmod计算器计算chmod权限和命令。

  rsa-key-pair-generator:
    title: RSA密钥对生成器
    description: 生成新的随机RSA私钥和公钥pem证书。

  html-wysiwyg-editor:
    title: HTML所见即所得编辑器
    description: 在线HTML编辑器具有功能丰富的所见即所得编辑器，立即获得内容的源代码。

  yaml-to-toml:
    title: YAML 到 TOML
    description: 解析YAML并将其转换为TOML。

  mac-address-generator:
    title: MAC 地址生成器
    description: 输入数量和前缀。MAC地址将以您选择的大小写（大写或小写）生成

  json-diff:
    title: JSON 差异比较
    description: 比较两个JSON对象并获得它们之间的差异。
  jwt-parser:
    title: JWT 解析器
    description: 解析和解码JSON Web Token（jwt）并显示其内容。

  jwt-generator:
    title: JWT 生成器
    description: 生成带签名的 JSON Web Token（HS/RS/PS/ES），并验证签名。

  date-converter:
    title: 日期时间转换器
    description: 将日期和时间转换为各种不同的格式

  phone-parser-and-formatter:
    title: 电话分析器和格式化程序
    description: 解析、验证和格式化电话号码。获取有关电话号码的信息，如国家/地区代码、类型等。

  ipv4-subnet-calculator:
    title: IPv4子网计算器
    description: 解析IPv4 CIDR块，并获取有关子网络的所有所需信息。

  og-meta-generator:
    title: 开放式图形元生成器
    description: 为您的网站生成开放式图形和社交html元标记。

  ipv6-ula-generator:
    title: IPv6 ULA生成器
    description: 根据RFC4193在网络上生成您自己的本地不可路由IP地址。
  dns-record-generator:
    title: DNS 记录生成器
    description: 生成邮件认证背后的 TXT 记录 —— SPF、DKIM、DMARC 与 BIMI。填好表单，拿到可以直接粘进 DNS 区域文件的记录名和记录值。

  hash-text:
    title: Hash 文本
    description: '使用所需的函数哈希文本字符串：MD5、SHA1、SHA2、SHA3、RIPEMD160、BLAKE2、BLAKE3、Keccak、xxHash、Adler-32、CRC-32、CRC-32C —— 也可以一次算完所有算法'

  json-to-toml:
    title: JSON 转 TOML
    description: 解析JSON并将其转换为TOML。

  device-information:
    title: 设备信息
    description: 获取有关当前设备的信息（屏幕大小、像素比率、用户代理…）

  pdf-signature-checker:
    title: PDF签名检查器
    description: '验证PDF文件的签名。签名的PDF文件包含一个或多个签名，可用于确定文件的内容在签名后是否已被更改。'

  json-minify:
    title: JSON 压缩
    description: 通过删除不必要的空白来缩小和压缩JSON。

  ulid-generator:
    title: ULID 生成器
    description: 生成随机的通用唯一词典可排序标识符（ULID）。

  string-obfuscator:
    title: 字符串混淆器
    description: 混淆字符串（如秘密、IBAN 或令牌），使其可共享和可识别，而不泄露其内容。

  base-converter:
    title: 整数基转换器
    description: 在不同的基数（十进制、十六进制、二进制、八进制、base64…）之间转换数字

  yaml-to-json-converter:
    title: YAML到JSON转换器
    description: 使用此在线转换器将YAML转换为JSON。

  uuid-generator:
    title: UUIDs 生成器
    description: 通用唯一标识符（UUID）是一个128位数字，用于标识计算机系统中的信息。可能的UUID数量为16^32，即2^128或约3.4x10^38（这是一个很大的数字！）。

  ipv4-address-converter:
    title: Ipv4地址转换器
    description: 在ipv6中，将ip地址转换为十进制、二进制、十六进制或事件

  text-statistics:
    title: 文本统计
    description: 获取有关文本、字符数、字数、大小等的信息

  text-to-nato-alphabet:
    title: 文本转北约字母表
    description: 将文本转换为北约拼音字母以进行口头传播。同时支持德语（DIN 5008）、法语、西班牙语与俄语拼读字母表。

  jasypt:
    title: Jasypt 字符串加解密
    description: 直接加解密 `jasypt-spring-boot` 从 application.yml 里读的 `ENC(...)`，不用先在项目里搭起 Java 环境。支持 PBEWithMD5AndDES（PBKDF1-MD5 + DES-CBC，Spring Boot 的默认算法）与 PBEWITHHMACSHA512ANDAES_256（PBKDF2-HMAC-SHA512 + AES-256-CBC）。迭代次数与盐长度不会编码进密文，解密时必须和加密时一致；这里的默认值与 Jasypt 自身相同。
  htpasswd:
    title: htpasswd 生成器
    description: 不用装 apache2-utils 就能生成并校验 Apache 的 .htpasswd 行。产出一行 `用户名:哈希`，可以直接粘进 docker-compose 的环境变量。支持 bcrypt（Apache 2.4.4 起的默认）、apr1 MD5（老版本默认，Windows 与网络共享上仍常见）、{SHA} 与明文。
  basic-auth-generator:
    title: 基本身份验证生成器
    description: 从用户名和密码生成 base64 基本身份验证标头。

  text-to-unicode:
    title: 文本转 Unicode
    description: 解析文本并将其转换为 unicode，反之亦然

  ipv4-range-expander:
    title: IPv4范围扩展器
    description: 给定起始和结束IPv4地址，此工具使用其CIDR表示法计算有效的IPv4网络。

  text-diff:
    title: 文本比较
    description: 比较两个文本并查看它们之间的差异。

  otp-generator:
    title: OTP代码生成器
    description: 为多因素身份验证生成和验证基于时间（TOTP）与基于计数器（HOTP）的OTP（一次性密码）。

  url-encoder:
    title: 编码/解码url格式的字符串
    description: 编码为url编码格式（也称为“百分比编码”）或从中解码。

  text-to-binary:
    title: 文本到 UTF-8 二进制
    description: 将文本转换为其 UTF-8 二进制表示形式，反之亦然。

  ssl-certificate-decoder:
    title: SSL 证书解码器
    description: 解码 X.509 证书，展示主题、签发者、有效期、公钥、SAN 条目与指纹。支持 PEM、base64 与 DER 十六进制，也可以一次贴入整条证书链。
  iana-timezone-index:
    title: IANA 时区索引
    description: 可搜索的 IANA 时区数据库索引。按时区名、缩写（CST）或 UTC 偏移（UTC+8）查一个时区，并看到当前偏移、标准偏移、是否处于夏令时以及当地时间。

  color-contrast-checker:
    title: 颜色对比度检查器
    description: 按 WCAG 2.1 检查两种颜色的对比度，给出比值并逐档标注普通文本 AA/AAA、大号文本 AA/AAA 与图形对象、UI 组件 AA 是否通过。支持 hex、rgb()、hsl() 与 CSS 命名色，带 alpha 的颜色按实际合成后计算。

  commit-memo:
    title: Conventional Commits 速查表
    description: 常规提交（Conventional Commits）速查表，含示例和常用工具。

  common-regex-memo:
    title: 常用正则速查表
    description: 常用正则表达式的速查表。

  csv-to-json:
    title: CSV 转 JSON
    description: 按 RFC 4180 解析 CSV 并转成 JSON 对象，支持引号字段、自定义分隔符、可选表头与类型推断。

  html-to-markdown:
    title: HTML 转 Markdown
    description: 把 HTML 转成 Markdown：标题、链接、列表、引用、代码块、图片都认，另外支持 GFM 的表格、删除线与任务列表。

  json-to-go:
    title: JSON 转 Go 类型
    description: 把 JSON 转成 Go 的类型定义（struct）。

  markdown-cheatsheet:
    title: Markdown 速查表
    description: Markdown 语法速查表。

  markdown-table-generator:
    title: Markdown 表格生成器
    description: 在可视化编辑器里拼 GitHub 风格的 Markdown 表格：增删行列、给每列设对齐方式，复制即可用。

  morse-code:
    title: 摩尔斯电码转换器
    description: 把文本编码成摩尔斯电码，也能把摩尔斯电码解码回文本。

  nano-memo:
    title: Nano 速查表
    description: Nano 编辑器快捷键速查表。

  punycode-converter:
    title: Punycode 转换器
    description: 把国际化域名或邮箱地址与 ASCII Punycode（RFC 3492）互相转换。

  chinese-number-converter:
    title: 中文数字转换器
    description: 中文数字与阿拉伯数字互相转换，支持简体与繁体数字。

  csr-generator:
    title: CSR 生成器
    description: 生成证书签名请求（CSR）与配套的密钥对，支持在 SAN 里放多个域名与 IP 地址。

  css-js-formatter:
    title: CSS / JavaScript 格式化器
    description: 格式化 CSS 与 JavaScript 代码，可选缩进宽度、制表符或空格缩进，以及换行符。

  data-size-converter:
    title: 数据大小转换器
    description: 在字节、千字节、兆字节、吉字节、太字节与拍字节之间换算数据大小，可切换十进制（SI，1 kB = 1000 B）与二进制（IEC，1 KiB = 1024 B）两套基数，全程精确整数运算，不产生浮点误差。

  exif-reader:
    title: EXIF 信息读取器
    description: 读取图片的 EXIF 元数据：相机厂商与型号、拍摄时间、曝光参数与 GPS 坐标。

  har-sanitizer:
    title: HAR 脱敏器
    description: 在分享 HAR 文件之前，把令牌、Cookie 等敏感数据清掉。

  ipv6-address-converter:
    title: IPv6 地址转换器
    description: 把 IPv6 地址换成展开、压缩、十进制、十六进制、二进制等写法，并给出 ARPA 反向域名与地址类型判定。

  ipv6-subnet-calculator:
    title: IPv6 子网计算器
    description: 计算 IPv6 CIDR 网段的网络地址、首个与末个地址、地址总数、掩码与通配掩码，并能把网段继续拆分成更小的子网。

  ssh-key-pair-generator:
    title: SSH 密钥对生成器
    description: 生成 OpenSSH 格式的 SSH 密钥对（ed25519 / ECDSA P-256 / RSA），可选口令加密，并给出对应的 authorized_keys 公钥行与 SHA256 指纹。

  unit-converter:
    title: 单位转换器
    description: 在长度、重量、面积、体积、时间、速度、角度、压力、能量、功率、力与数据大小之间换算数值，共 12 个类别、128 个单位；源单位与目标单位始终属于同一类别，不会出现「米换千克」这种跨量纲的组合。

  week-number-converter:
    title: 周数转换器
    description: 在日期、ISO 周数与月内周数之间互相转换。周一为一周之首，月内第 1 周是含当月 1 号的那一周。

  x509-certificate-generator:
    title: X.509 证书生成器
    description: 生成自签的 X.509 证书与配套私钥，支持在 SAN 里放多个域名与 IP 地址。

  xml-diff:
    title: XML 差异对比
    description: 对比两份 XML 文档，高亮标出差异。

  dns-query:
    title: DNS 记录查询
    description: 查询域名的 A、AAAA、CNAME、MX、TXT、NS、SOA、SRV、PTR、CAA 记录。

  date-calculator:
    title: 日期计算器
    description: 加减天数、算两个日期之间的间隔、算年龄 —— 全部按日历日计算，夏令时切换不会让结果差一天。

  docker-compose-validator:
    title: Docker Compose 文件校验
    description: 校验 docker-compose.yml，逐条列出语法错误与语义问题，给出所在行号、说明与建议修法；重点检查服务之间的交叉引用、端口、卷与网络。

  ical-generator:
    title: iCal 生成器
    description: 生成符合 RFC 5545 的 .ics 日历事件，时间统一按 UTC 输出，不需要 VTIMEZONE。

  ical-parser:
    title: iCal 解析器
    description: 把 .ics 解析成一张看得懂的事件表：折行先展开，文本反转义，UTC 时间转成本地时间显示。

  icon-generator:
    title: 图标生成器
    description: 从一张图片批量生成应用图标、Web App manifest，并打包成 ZIP。

  integer-to-ip:
    title: 整数转 IP 地址
    description: 把整数转成 IPv4 地址、符合 RFC 5952 的 IPv6 地址，以及十六进制与二进制。

  json-to-csharp:
    title: JSON 转 C# 类型
    description: 把 JSON 转成 C# 的类型定义（class / record）。

  object-id:
    title: ObjectId 生成与解析
    description: 生成 MongoDB ObjectId，并拆解它的结构（时间戳、随机值、计数器）。日期与 ObjectId 之间的双向换算由 date-time-converter 工具的 mongo-objectid 格式负责，这里补的是生成与结构拆解，两者互补不重复。

  stacktrace-formatter:
    title: 堆栈追踪格式化
    description: 把堆栈（V8、Firefox、Java、Python、.NET）解析成帧，表格查看，复制成对齐文本或高亮 HTML。

  uuid-parser:
    title: UUID 解析器
    description: 解析 UUID，列出版本、变体、时间戳、时钟序列、节点标识，并给出 Microsoft GUID 形式。

  exif-remover:
    title: 去除图片元数据
    description: 列出 JPEG、PNG、WebP 里的元数据段，勾掉要删的那些 —— 图像数据一个字节都不重新编码，原样搬运。

  markdown-table-formatter:
    title: Markdown 表格格式化
    description: 把 Markdown 表格的列排整齐：每一列按最宽的那一格补空格，分隔行跟着重建，对齐标记原样保留。

  arpa-decoder:
    title: ARPA 地址解码
    description: 把 IPv4 与 IPv6 的 ARPA（反向 DNS）地址解回 IP 地址，也能把 IP 地址转成 ARPA 名字。

  bimi-dns-generator:
    title: BIMI DNS 记录生成器
    description: 生成把品牌标识与域名关联起来的 BIMI TXT 记录。

  cidr-in-cidr:
    title: 网段包含判断
    description: 判断一个网段是不是完全落在另一个网段里。

  crc-calculator:
    title: CRC 计算器
    description: 一次算出一段文本的 13 种 CRC 变体（CRC-1、CRC-8、CRC-16、CRC-24、CRC-32、MODBUS、KERMIT、CCITT、MPEG-2、JAMCRC）。

  distinct-words:
    title: 去重词频统计
    description: 提取文本里每个不同词的出现次数。

  dkim-dns-generator:
    title: DKIM DNS 记录生成器
    description: 根据公钥生成 DKIM TXT 记录。

  dmarc-dns-generator:
    title: DMARC DNS 记录生成器
    description: 根据策略与报告地址生成 DMARC TXT 记录。

  duplicate-line-finder:
    title: 重复行查找
    description: 找出文本里重复出现的行。

  ecdsa-key-pair-generator:
    title: ECDSA 密钥对生成器
    description: 在 NIST P-256 / P-384 / P-521 上生成 ECDSA 密钥对。私钥给 PKCS#8 与 SEC1 两种 PEM，公钥给 SPKI PEM，也可以两份都给原始字节的 hex。

  ecdsa-signing:
    title: ECDSA 签名与验签
    description: 用 ECDSA 私钥（P-256、P-384 或 P-521）给一段文本签名，再用对应的公钥验签。摘要由曲线决定：SHA-256、SHA-384 或 SHA-512。

  ed25519-key-pair-generator:
    title: Ed25519 密钥对生成器
    description: 生成 Ed25519 密钥对。私钥给 PKCS#8 PEM，公钥给 SPKI PEM，也可以两份都给原始字节的 hex。

  file-hasher:
    title: 文件哈希
    description: 一次算出上传文件的所有摘要（MD5、SHA-1、SHA-2、SHA-3、BLAKE2、BLAKE3、Keccak、RIPEMD-160、xxHash、Adler-32、CRC-32）。

  folder-structure-diagram:
    title: 目录结构图
    description: 生成目录结构的树状 ASCII 图。

  gitattributes-generator:
    title: .gitattributes 生成器
    description: 用常见模板生成 .gitattributes 文件。

  gitignore-generator:
    title: .gitignore 生成器
    description: 用常见模板生成 .gitignore 文件。

  html-formatter:
    title: HTML 格式化
    description: 格式化 HTML 源码并做好缩进。

  i-and-l-checker:
    title: 形近字符检查
    description: 高亮那些容易混淆的字符，比如 1、l、I、0、O。

  ip-cidr-to-range:
    title: CIDR 网段转地址区间
    description: 把一个 CIDR 网段算成地址区间，一并给出网络地址、子网掩码、反掩码、地址总数与可用主机数。

  ip-include-exclude:
    title: IP 包含与排除
    description: 给一段允许的网段，扣掉要排除的那些，剩下的以 CIDR 列出来。

  ip-range-to-cidr:
    title: 地址区间转 CIDR
    description: 把一段地址区间拆成数量最少的几个 CIDR 网段（IPv4 与 IPv6 都能用）。

  ipv4-subnets-list:
    title: IPv4 子网清单
    description: 列出一个 IPv4 网段下的子网：可以一级级往下切，也可以指定前缀长度，每个子网都给出可用主机区间。

  json-to-protobuf:
    title: JSON 转 Protobuf
    description: 从一份 JSON 生成 protobuf3 的 message 定义。

  json-to-schema:
    title: JSON 转 Schema
    description: 从 JSON 推出 schema —— JSON Schema、MySQL、Mongoose、BigQuery、ClickHouse，或者一份人能看懂的缩进大纲。

  json-to-sql-insert:
    title: JSON 转 SQL INSERT
    description: 把一份 JSON 变成 SQL INSERT 语句。

  json-to-typescript:
    title: JSON 转 TypeScript
    description: 从一份 JSON 生成 TypeScript 类型（interface 或 type 别名）。

  levenshtein-calculator:
    title: 编辑距离计算器
    description: 计算两个字符串之间的编辑距离。

  list-comparer:
    title: 列表对比
    description: 对比两个列表，给出只在第一份、只在第二份、以及两份都有的条目。

  ptr-dns-generator:
    title: PTR DNS 记录生成器
    description: 为 IP 地址生成反向 DNS 的 PTR 记录。

  random-line-picker:
    title: 随机抽行
    description: 从输入的文本里随机抽出若干行。

  rsa-encryption:
    title: RSA 加解密
    description: 用 RSA 密钥对给文本加解密。支持 PKCS#1 v1.5 与 OAEP（SHA-1 或 SHA-256），也能读带口令保护的私钥。

  shell-formatter:
    title: Shell 命令格式化
    description: 把一条 shell 命令拆成按参数分行的多行命令。

  shell-linearizer:
    title: Shell 命令单行化
    description: 把多行的 shell 命令压成一行。

  smart-text-replacer:
    title: 智能文本替换
    description: 查找并替换文本，支持正则表达式与按行拆分。

  spf-dns-generator:
    title: SPF DNS 记录生成器
    description: 根据允许与禁止的来源生成 SPF TXT 记录。

  tab-to-spaces:
    title: 制表符转空格
    description: 在制表符与空格之间互转，宽度可调。

  wpa-psk-generator:
    title: WPA-PSK 密钥生成器
    description: 用口令与 SSID 派生 256 位的 WPA-PSK 原始密钥（PBKDF2-HMAC-SHA1，迭代 4096 轮，与 IEEE 802.11i 一致）。

  css-minifier:
    title: CSS 压缩器
    description: 压缩一段样式表：去掉注释、收拢空白、删掉多余的符号 —— 字符串、url() 与 !important 原样不动。

  html-minifier:
    title: HTML 压缩器
    description: 压缩一段 HTML：去掉注释、收拢空白、删掉多余的引号 —— script、style、textarea 与 pre 里的内容逐字节保留。
