# es 语言包。
#
# 英文从 `locales/en.yml` 来，这个文件是同结构的其他语言。
# 键没译到的会**逐条**回退到英文（见 src/i18n.rs 的 t()），
# 所以这个文件可以只写一部分 —— 缺的那条显示英文，不会露出键名。
#
# 由 scripts/i18n/merge.py 从 new-tool/i18n/es/ 下的翻译片段合并而成。
#

tools:
  argon2-hash-generator:
    description: 'Calcula el hash y compara cadenas de texto con Argon2 (argon2id, argon2i o argon2d), con tamaño de memoria, número de iteraciones, paralelismo y longitud del hash configurables. Argon2 ganó el Password Hashing Competition y es la recomendación actual para almacenar contraseñas.'
    title: 'Generador de hash Argon2'
  ascii-text-drawer:
    description: 'Dibuja una palabra o unas pocas líneas de texto como arte ASCII.'
    title: 'Dibujador de texto ASCII'
  base-converter:
    description: 'Convierte un número entre distintas bases (decimal, hexadecimal, binario, octal, base64, ...)'
    title: 'Conversor de bases numéricas'
  base64-file-converter:
    description: 'Convierte una cadena, un archivo o una imagen a su representación base64.'
    title: 'Conversor de archivos base64'
  base64-string-converter:
    description: 'Codifica y decodifica cadenas en su representación Base64 sin más.'
    title: 'Codificador/decodificador de cadenas Base64'
  basic-auth-generator:
    description: 'Genera una cabecera de autenticación Basic en base64 a partir de un nombre de usuario y una contraseña.'
    title: 'Generador de autenticación Basic'
  bcrypt:
    description: 'Calcula el hash y compara cadenas de texto con bcrypt. Bcrypt es una función de hash de contraseñas basada en el cifrado Blowfish.'
    title: 'Bcrypt'
  benchmark-builder:
    description: 'Compara fácilmente el tiempo de ejecución de tareas con este sencillo generador de benchmarks en línea.'
    title: 'Generador de benchmarks'
  bip39-generator:
    description: 'Genera una frase de contraseña BIP39 a partir de un mnemónico existente o aleatorio, u obtén el mnemónico a partir de la frase de contraseña.'
    title: 'Generador de frases de contraseña BIP39'
  camera-recorder:
    description: 'Haz una foto o graba un vídeo desde tu webcam o cámara.'
    title: 'Grabador de cámara'
  case-converter:
    description: 'Cambia las mayúsculas y minúsculas de una cadena y elige entre distintos formatos.'
    title: 'Conversor de mayúsculas y minúsculas'
  categories:
    converter: 'Conversión'
    crypto: 'Criptografía'
    data: 'Datos'
    development: 'Desarrollo'
    'images and videos': 'Imágenes y vídeos'
    math: 'Matemáticas'
    measurement: 'Medición'
    network: 'Red'
    text: 'Texto'
    web: 'Web'
  chinese-number-converter:
    description: 'Convierte entre números chinos y números árabes. Admite numerales financieros en mayúsculas (壹贰叁), numerales simples, importes en RMB y variantes de caracteres tradicionales.'
    title: 'Conversor de números chinos'
  chmod-calculator:
    description: 'Calcula tus permisos y comandos chmod con esta calculadora de chmod en línea.'
    title: 'Calculadora de chmod'
  chronometer:
    description: 'Controla la duración de algo. Básicamente, un cronómetro con funciones sencillas de cronómetro.'
    title: 'Cronómetro'
  color-contrast-checker:
    description: 'Comprueba la relación de contraste de dos colores según los umbrales de texto y componentes de interfaz de WCAG 2.1 AA y AAA.'
    title: 'Comprobador de contraste de color'
  color-converter:
    description: 'Convierte el color entre los distintos formatos (hex, rgb, hsl y nombre CSS)'
    title: 'Conversor de color'
  commit-memo:
    description: 'Chuleta de conventional commits con ejemplos y herramientas habituales'
    title: 'Chuleta de conventional commits'
  common-regex-memo:
    description: 'Chuleta de las expresiones regulares más usadas'
    title: 'Chuleta de expresiones regulares'
  crontab-generator:
    description: 'Valida y genera crontabs y obtén la descripción legible del programa cron.'
    title: 'Generador de crontab'
  csr-generator:
    description: 'Genera una solicitud de firma de certificado (CSR) y su par de claves, con soporte para varios dominios y direcciones IP en el SAN.'
    title: 'Generador de CSR'
  css-js-formatter:
    description: 'Formatea y embellece código CSS o JavaScript. Elige el tamaño de sangría, la sangría con tabulaciones o espacios y el final de línea.'
    title: 'Formateador de CSS y JavaScript'
  csv-to-json:
    description: 'Convierte CSV a JSON con campos entre comillas según RFC 4180, delimitadores personalizados, cabeceras opcionales e inferencia de tipos.'
    title: 'CSV a JSON'
  data-size-converter:
    description: 'Convierte tamaños de datos entre bytes, kilobytes, megabytes, gigabytes, terabytes y petabytes, con base decimal (SI) o binaria (IEC) intercambiable.'
    title: 'Conversor de tamaño de datos'
  date-calculator:
    description: 'Suma o resta días, calcula la diferencia entre dos fechas y obtén una edad: todo sobre el día natural, de modo que el cambio de horario de verano nunca desplaza un resultado.'
    title: 'Calculadora de fechas'
  date-converter:
    description: 'Convierte una fecha y una hora a los distintos formatos'
    title: 'Conversor de fecha y hora'
  device-information:
    description: 'Obtén información sobre tu dispositivo actual (tamaño de pantalla, proporción de píxeles, user agent, ...)'
    title: 'Información del dispositivo'
  dns-query:
    description: 'Consulta los registros A, AAAA, CNAME, MX, TXT, NS, SOA, SRV, PTR y CAA de un nombre de dominio.'
    title: 'Búsqueda de registros DNS'
  dns-record-generator:
    description: 'Construye los registros TXT que hay detrás de la autenticación de correo — SPF, DKIM, DMARC y BIMI. Rellena el formulario y obtén el nombre y el valor del registro para pegarlos en tu zona DNS.'
    title: 'Generador de registros DNS'
  docker-compose-validator:
    description: 'Valida un archivo docker-compose.yml y lista sus errores de sintaxis y problemas semánticos con su ubicación y una corrección sugerida.'
    title: 'Validador de Docker Compose'
  docker-run-to-docker-compose-converter:
    description: '¡Transforma comandos "docker run" en archivos docker-compose!'
    title: 'Conversor de docker run a Docker compose'
  email-header-parser:
    description: 'Analiza las cabeceras de correo electrónico en bruto en secciones legibles: lista de remitentes y destinatarios, asunto, fecha, ruta de entrega Received y resultados SPF/DKIM/DMARC. Decodifica las palabras codificadas en RFC 2047 y despliega las cabeceras plegadas.'
    title: 'Analizador de cabeceras de correo'
  email-normalizer:
    description: 'Normaliza una dirección de correo electrónico — pásala a minúsculas, quita los puntos de los alias tipo Gmail y mucho más.'
    title: 'Normalizador de correo electrónico'
  emoji-picker:
    description: 'Copia y pega emojis fácilmente y obtén el valor Unicode y los puntos de código de cada emoji.'
    title: 'Selector de emojis'
  encryption:
    description: 'Cifra texto claro y descifra texto cifrado usando algoritmos criptográficos como AES, TripleDES, Rabbit o RC4.'
    title: 'Cifrar / descifrar texto'
  eta-calculator:
    description: 'Una calculadora de ETA (tiempo estimado de llegada) para determinar el final aproximado de una tarea, por ejemplo, el final y la duración de la descarga de un archivo.'
    title: 'Calculadora de ETA'
  exif-reader:
    description: 'Lee los metadatos EXIF de una imagen: marca y modelo de la cámara, fecha de captura, ajustes de exposición y coordenadas GPS.'
    title: 'Lector EXIF'
  exif-remover:
    description: 'Lista los segmentos de metadatos de un JPEG, PNG o WebP y elimina los que elijas: los datos de la imagen se copian byte a byte, nunca se vuelven a codificar.'
    title: 'Eliminar metadatos de una imagen'
  git-memo:
    description: 'Git es un software de control de versiones descentralizado. Con esta chuleta tienes acceso rápido a los comandos de git más habituales.'
    title: 'Chuleta de Git'
  har-sanitizer:
    description: 'Elimina tokens, cookies y otros datos sensibles de un archivo HAR antes de compartirlo.'
    title: 'Sanitizador de HAR'
  hash-text:
    description: 'Hashea una cadena de texto con la función que necesites: MD5, SHA1, SHA256, SHA224, SHA512, SHA384, SHA3, RIPEMD160, BLAKE2, BLAKE3, Keccak, xxHash, Adler-32, CRC-32, CRC-32C — o todas a la vez'
    title: 'Hashear texto'
  hmac-generator:
    description: 'Calcula un código de autenticación de mensajes basado en hash (HMAC) usando una clave secreta y tu función de hash favorita.'
    title: 'Generador de HMAC'
  html-entities:
    description: 'Escapa o desescapa entidades HTML (reemplaza caracteres como <,>, &, " y '' por su versión HTML).'
    title: 'Escapar entidades HTML'
  html-to-markdown:
    description: 'Convierte HTML a Markdown. Se admiten encabezados, enlaces, listas, citas, bloques de código e imágenes, además de tablas GFM, texto tachado y listas de tareas.'
    title: 'HTML a Markdown'
  html-wysiwyg-editor:
    description: 'Editor HTML WYSIWYG en línea y con muchas funciones que genera al instante el código fuente del contenido.'
    title: 'Editor HTML WYSIWYG'
  htpasswd:
    description: 'Genera y verifica líneas .htpasswd de Apache sin instalar apache2-utils. Produce una línea `username:hash` que puedes pegar directamente en una variable de entorno de docker-compose. Admite bcrypt (el valor por defecto de Apache desde 2.4.4), apr1 MD5 (el antiguo, todavía habitual en Windows y en recursos compartidos de red), {SHA} y texto plano.'
    title: 'Generador de htpasswd'
  http-status-codes:
    description: 'La lista de todos los códigos de estado HTTP, su nombre y su significado.'
    title: 'Códigos de estado HTTP'
  iana-timezone-index:
    description: 'Índice consultable de la base de datos de zonas horarias IANA. Busca una zona por su nombre, por su abreviatura (CST) o por su desplazamiento UTC (UTC+8) y consulta el desplazamiento actual, el desplazamiento estándar, si está activo el horario de verano y la hora local actual.'
    title: 'Índice de zonas horarias IANA'
  iban-validator-and-parser:
    description: 'Valida y analiza números IBAN. Comprueba si un IBAN es válido y obtén el país, el BBAN, si es un QR-IBAN y el formato IBAN legible.'
    title: 'Validador y analizador de IBAN'
  ical-generator:
    description: 'Crea un evento de calendario .ics según la RFC 5545, con las horas en UTC y sin necesidad de VTIMEZONE.'
    title: 'Generador iCal'
  ical-parser:
    description: 'Analiza un archivo .ics en una tabla de eventos legible, con las líneas plegadas desplegadas y el texto sin escapar.'
    title: 'Analizador de iCal'
  icon-generator:
    description: 'Genera conjuntos de iconos de app, un manifiesto PWA y un archivo ZIP a partir de una sola imagen.'
    title: 'Generador de iconos'
  integer-to-ip:
    description: 'Convierte un entero en una dirección IPv4, una dirección IPv6 RFC 5952, hexadecimal y binario.'
    title: 'De entero a IP'
  ipv4-address-converter:
    description: 'Convierte una dirección IP a decimal, binaria, hexadecimal o incluso a IPv6.'
    title: 'Conversor de direcciones IPv4'
  ipv4-range-expander:
    description: 'A partir de una dirección IPv4 inicial y una final, esta herramienta calcula una subred IPv4 válida junto con su notación CIDR.'
    title: 'Expansor de rangos IPv4'
  ipv4-subnet-calculator:
    description: 'Analiza tus bloques CIDR IPv4 y obtén toda la información que necesitas sobre tu subred.'
    title: 'Calculadora de subredes IPv4'
  ipv6-address-converter:
    description: 'Convierte una dirección IPv6 a sus formas expandida, comprimida, decimal, hexadecimal y binaria, además del nombre inverso ARPA y el tipo de dirección.'
    title: 'Conversor de direcciones IPv6'
  ipv6-subnet-calculator:
    description: 'Calcula la dirección de red, el primer y el último host, el número de direcciones, la máscara de red y la máscara wildcard de un bloque CIDR IPv6, y divídelo en subredes más pequeñas.'
    title: 'Calculadora de subredes IPv6'
  ipv6-ula-generator:
    description: 'Genera tus propias direcciones IP locales y no enrutables para tu red, según la RFC4193.'
    title: 'Generador de ULA IPv6'
  jasypt:
    description: 'Cifra y descifra los valores `ENC(...)` que `jasypt-spring-boot` lee de application.yml, sin montar un proyecto Java. Admite PBEWithMD5AndDES (PBKDF1-MD5 + DES-CBC, el valor predeterminado de Spring Boot) y PBEWITHHMACSHA512ANDAES_256 (PBKDF2-HMAC-SHA512 + AES-256-CBC). El número de iteraciones y la longitud de la sal no se codifican en el texto cifrado, así que ambos deben coincidir al descifrar; los valores predeterminados aquí son los mismos que los de Jasypt.'
    title: 'Cifrador / descifrador de cadenas Jasypt'
  json-diff:
    description: 'Compara dos objetos JSON y obtén las diferencias entre ellos.'
    title: 'Diferencia JSON'
  json-minify:
    description: 'Minifica y comprime tu JSON eliminando los espacios innecesarios.'
    title: 'Minificar JSON'
  json-prettify:
    description: 'Formatea tu cadena JSON en un formato legible por personas.'
    title: 'Formatear y embellecer JSON'
  json-to-csharp:
    description: 'Convierte JSON en definiciones de tipos C# (clases o records).'
    title: 'JSON a C#'
  json-to-csv:
    description: 'Convierte JSON en CSV con detección automática de cabeceras.'
    title: 'JSON a CSV'
  json-to-go:
    description: 'Convierte JSON en definiciones de tipos de Go (structs).'
    title: 'JSON a Go'
  json-to-toml:
    description: 'Analiza y convierte JSON a TOML.'
    title: 'JSON a TOML'
  json-to-xml:
    description: 'Convierte documentos JSON en XML. Útil para el intercambio de datos y la depuración de API.'
    title: 'De JSON a XML'
  json-to-yaml-converter:
    description: 'Convierte fácilmente JSON en YAML con este convertidor en línea.'
    title: 'Conversor de JSON a YAML'
  jwt-generator:
    description: 'Genera un JSON Web Token firmado (HS/RS/PS/ES) y verifica su firma.'
    title: 'Generador de JWT'
  jwt-parser:
    description: 'Analiza y decodifica tu JSON Web Token (JWT) y muestra su contenido.'
    title: 'Analizador de JWT'
  keycode-info:
    description: 'Descubre el keycode de JavaScript, el código, la ubicación y los modificadores de cualquier tecla pulsada.'
    title: 'Información de keycode'
  list-converter:
    description: 'Esta herramienta puede procesar datos por columnas y aplicar a cada fila distintas modificaciones (transponer, añadir prefijo y sufijo, invertir la lista, ordenar la lista, pasar los valores a minúsculas, truncar los valores).'
    title: 'Conversor de listas'
  lorem-ipsum-generator:
    description: 'Lorem ipsum es un texto de relleno que se usa habitualmente para demostrar la forma visual de un documento o de una tipografía sin recurrir a contenido significativo'
    title: 'Generador de Lorem Ipsum'
  mac-address-generator:
    description: 'Introduce la cantidad y el prefijo. Las direcciones MAC se generarán en el formato que elijas (mayúsculas o minúsculas)'
    title: 'Generador de direcciones MAC'
  mac-address-lookup:
    description: 'Descubre el proveedor y el fabricante de un dispositivo a partir de su dirección MAC.'
    title: 'Buscador de direcciones MAC'
  markdown-cheatsheet:
    description: 'Chuleta de Markdown'
    title: 'Chuleta de Markdown'
  markdown-table-formatter:
    description: 'Alinea las columnas de una tabla Markdown: cada columna se rellena hasta su celda más ancha, la fila separadora se rehace a esa medida y las marcas de alineación se conservan.'
    title: 'Formateador de tablas Markdown'
  markdown-table-generator:
    description: 'Crea una tabla Markdown compatible con GitHub en un editor visual: añade o quita filas y columnas, define la alineación de cada columna y copia el resultado.'
    title: 'Generador de tablas Markdown'
  markdown-to-html:
    description: 'Convierte texto Markdown en HTML que puedes pegar directamente en una página, un correo o un documento.'
    title: 'Markdown a HTML'
  math-evaluator:
    description: 'Una calculadora para evaluar expresiones matemáticas. Puedes usar funciones como sqrt, cos, sin, abs, etc.'
    title: 'Evaluador de expresiones matemáticas'
  mime-types:
    description: 'Convierte tipos MIME en extensiones de archivo y viceversa.'
    title: 'Tipos MIME'
  morse-code:
    description: 'Codifica texto en código Morse y decodifica el código Morse de nuevo a texto.'
    title: 'Conversor de código Morse'
  nano-memo:
    description: 'Chuleta del editor Nano'
    title: 'Chuleta de Nano'
  numeronym-generator:
    description: 'Un numeronym es una palabra en la que se usa un número para formar una abreviatura. Por ejemplo, «i18n» es un numeronym de «internationalization», donde 18 representa el número de letras entre la primera i y la última n de la palabra.'
    title: 'Generador de numeronyms'
  object-id:
    description: 'Genera ObjectId de MongoDB e inspecciona su estructura (marca de tiempo, valor aleatorio, contador). La herramienta date-time-converter ya convierte fechas desde y hacia el formato mongo-objectid en ambos sentidos, así que esta se ocupa de la generación y del desglose estructural.'
    title: 'MongoDB ObjectId'
  og-meta-generator:
    description: 'Genera etiquetas meta HTML de Open Graph y sociales para tu sitio web.'
    title: 'Generador de meta tags Open Graph'
  otp-generator:
    description: 'Genera y valida OTP (contraseñas de un solo uso) basados en el tiempo y en eventos para la autenticación multifactor.'
    title: 'Generador de códigos OTP'
  password-strength-analyser:
    description: 'Descubre la fortaleza de tu contraseña con este analizador de fortaleza de contraseñas, que funciona solo en el cliente, y esta herramienta de estimación del tiempo de descifrado.'
    title: 'Analizador de fortaleza de contraseñas'
  pdf-signature-checker:
    description: 'Verifica las firmas de un archivo PDF. Un archivo PDF firmado contiene una o varias firmas que permiten determinar si el contenido del archivo se ha alterado desde que se firmó.'
    title: 'Verificador de firmas PDF'
  percentage-calculator:
    description: 'Calcula fácilmente porcentajes de un valor a otro, o de un porcentaje a un valor.'
    title: 'Calculadora de porcentajes'
  phone-parser-and-formatter:
    description: 'Analiza, valida y formatea números de teléfono. Obtén información sobre el número, como el prefijo del país, el tipo, etc.'
    title: 'Analizador y formateador de números de teléfono'
  punycode-converter:
    description: 'Convierte nombres de dominio internacionalizados o direcciones de correo a Punycode ASCII y viceversa (RFC 3492).'
    title: 'Conversor de Punycode'
  qrcode-generator:
    description: 'Genera y descarga un código QR para una URL (o texto plano) y personaliza los colores de fondo y de primer plano.'
    title: 'Generador de códigos QR'
  random-port-generator:
    description: 'Genera números de puerto aleatorios fuera del rango de los puertos «conocidos» (0-1023).'
    title: 'Generador de puertos aleatorios'
  regex-memo:
    description: 'Una chuleta de las construcciones de expresiones regulares más habituales.'
    title: 'Chuleta de regex'
  regex-tester:
    description: 'Escribe una expresión regular y pruébala en vivo con una cadena de ejemplo.'
    title: 'Probador de regex'
  roman-numeral-converter:
    description: 'Convierte números romanos en números y números en números romanos.'
    title: 'Conversor de números romanos'
  rsa-key-pair-generator:
    description: 'Genera un nuevo par de claves RSA aleatorias, privada y pública, en formato PEM.'
    title: 'Generador de pares de claves RSA'
  safelink-decoder:
    description: 'Decodifica los SafeLinks de Outlook para ver a qué URL apuntan realmente.'
    title: 'Decodificador de SafeLinks'
  slugify-string:
    description: 'Haz que una cadena sea segura como URL, nombre de archivo e id.'
    title: 'Convertir cadena en slug'
  sql-prettify:
    description: 'Formatea y embellece tus consultas SQL en línea (admite varios dialectos de SQL).'
    title: 'Embellecer y formatear SQL'
  ssh-key-pair-generator:
    description: 'Genera un par de claves SSH en formato OpenSSH (ed25519, ECDSA P-256 o RSA), con una frase de contraseña opcional y la línea authorized_keys correspondiente junto con la huella SHA256.'
    title: 'Generador de pares de claves SSH'
  ssl-certificate-decoder:
    description: 'Decodifica un certificado X.509 y muestra su subject, emisor, periodo de validez, clave pública, entradas SAN y huellas. Acepta PEM, base64 o DER en hexadecimal: puedes pegar una cadena completa de certificados de una vez.'
    title: 'Decodificador de certificados SSL'
  stacktrace-formatter:
    description: 'Analiza una traza de pila (V8, Firefox, Java, Python, .NET) en fotogramas, y cópiala como texto alineado o HTML resaltado.'
    title: 'Formateador de trazas de pila'
  string-obfuscator:
    description: 'Ofusca una cadena (como un secreto, un IBAN o un token) para poder compartirla e identificarla sin revelar su contenido.'
    title: 'Ofuscador de cadenas'
  svg-placeholder-generator:
    description: 'Genera imágenes SVG para usar como marcador de posición en tus aplicaciones.'
    title: 'Generador de marcadores SVG'
  temperature-converter:
    description: 'Conversiones de temperatura en grados para Kelvin, Celsius, Fahrenheit, Rankine, Delisle, Newton, Réaumur y Rømer.'
    title: 'Conversor de temperatura'
  text-diff:
    description: 'Compara dos textos y observa las diferencias entre ellos.'
    title: 'Diferencia de texto'
  text-statistics:
    description: 'Obtén información sobre un texto: el número de caracteres, el número de palabras, su tamaño en bytes, ...'
    title: 'Estadísticas de texto'
  text-to-binary:
    description: 'Convierte texto en su representación binaria UTF-8 y viceversa.'
    title: 'Texto a binario UTF-8'
  text-to-nato-alphabet:
    description: 'Transforma texto en el alfabeto fonético NATO para la transmisión oral. También admite los alfabetos de deletreo alemán (DIN 5008), francés, español y ruso.'
    title: 'Texto a alfabeto NATO'
  text-to-unicode:
    description: 'Analiza y convierte texto a unicode y viceversa'
    title: 'Texto a Unicode'
  token-generator:
    description: 'Genera una cadena aleatoria con los caracteres que quieras, letras mayúsculas o minúsculas, números y/o símbolos.'
    title: 'Generador de tokens'
  toml-to-json:
    description: 'Analiza y convierte TOML en JSON.'
    title: 'TOML a JSON'
  toml-to-yaml:
    description: 'Analiza y convierte TOML a YAML.'
    title: 'TOML a YAML'
  ulid-generator:
    description: 'Genera identificadores ULID (Universally Unique Lexicographically Sortable Identifier) aleatorios.'
    title: 'Generador de ULID'
  unit-converter:
    description: 'Convierte valores entre unidades de longitud, masa, superficie, volumen, tiempo, velocidad, ángulo, presión, energía, potencia, fuerza y tamaño de datos.'
    title: 'Conversor de unidades'
  url-encoder:
    description: 'Codifica texto en formato URL (también llamado «percent-encoded») o decodifícalo.'
    title: 'Codificar/decodificar cadenas con formato de URL'
  url-parser:
    description: 'Analiza una URL en sus distintas partes (protocolo, origen, parámetros, puerto, usuario-contraseña, ...)'
    title: 'Analizador de URL'
