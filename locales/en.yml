tools:
  categories:
    crypto: Crypto
    converter: Converter
    web: Web
    images and videos: 'Images & Videos'
    development: Development
    network: Network
    math: Math
    measurement: Measurement
    text: Text
    data: Data


  # 参考项目的语言包最后同步于这 8 个工具之前，缺少条目，这里补齐。
  xml-to-json:
    title: XML to JSON
    description: Convert XML documents into JSON. Handy for data interchange and API debugging.

  json-to-xml:
    title: JSON to XML
    description: Convert JSON documents into XML. Handy for data interchange and API debugging.

  markdown-to-html:
    title: Markdown to HTML
    description: Turn Markdown text into HTML you can paste straight into a page, an email or a document.

  safelink-decoder:
    title: SafeLinks decoder
    description: Decode Outlook SafeLinks to reveal the URL they actually point to.

  email-normalizer:
    title: Email normalizer
    description: 'Normalize an email address — lowercase it, strip dots from Gmail-style aliases and more.'

  email-header-parser:
    title: Email header parser
    description: 'Parse raw email headers into readable sections — sender/recipient list, subject, date, the Received delivery path and SPF/DKIM/DMARC results. Decodes RFC 2047 encoded words and unfolds folded headers.'

  regex-tester:
    title: Regex tester
    description: Write a regular expression and test it live against a sample string.

  regex-memo:
    title: Regex memo
    description: A cheat sheet of the most common regular expression constructs.

  ascii-text-drawer:
    title: ASCII text drawer
    description: Render a word or a few lines of text as ASCII art.

  password-strength-analyser:
    title: Password strength analyser
    description: Discover the strength of your password with this client-side-only password strength analyser and crack time estimation tool.

  chronometer:
    title: Chronometer
    description: Monitor the duration of a thing. Basically a chronometer with simple chronometer features.

  token-generator:
    title: Token generator
    description: Generate random string with the chars you want, uppercase or lowercase letters, numbers and/or symbols.
  percentage-calculator:
    title: Percentage calculator
    description: Easily calculate percentages from a value to another value, or from a percentage to a value.

  svg-placeholder-generator:
    title: SVG placeholder generator
    description: Generate svg images to use as a placeholder in your applications.

  json-to-csv:
    title: JSON to CSV
    description: Convert JSON to CSV with automatic header detection.

  camera-recorder:
    title: Camera recorder
    description: Take a picture or record a video from your webcam or camera.

  keycode-info:
    title: Keycode info
    description: Find the javascript keycode, code, location and modifiers of any pressed key.

  emoji-picker:
    title: Emoji picker
    description: Copy and paste emojis easily and get the unicode and code points value of each emoji.

  color-converter:
    title: Color converter
    description: Convert color between the different formats (hex, rgb, hsl and css name)

  bcrypt:
    title: Bcrypt
    description: Hash and compare text string using bcrypt. Bcrypt is a password-hashing function based on the Blowfish cipher.

  argon2-hash-generator:
    title: Argon2 hash generator
    description: Hash and compare text strings using Argon2 (argon2id, argon2i or argon2d), with a configurable memory size, iteration count, parallelism and hash length. Argon2 is the winner of the Password Hashing Competition and the current recommendation for storing passwords.

  crontab-generator:
    title: Crontab generator
    description: Validate and generate crontab and get the human-readable description of the cron schedule.

  http-status-codes:
    title: HTTP status codes
    description: The list of all HTTP status codes, their name, and their meaning.

  sql-prettify:
    title: SQL prettify and format
    description: Format and prettify your SQL queries online (it supports various SQL dialects).

  benchmark-builder:
    title: Benchmark builder
    description: Easily compare execution time of tasks with this very simple online benchmark builder.

  git-memo:
    title: Git cheatsheet
    description: Git is a decentralized version management software. With this cheatsheet, you will have quick access to the most common git commands.

  slugify-string:
    title: Slugify string
    description: Make a string url, filename and id safe.

  encryption:
    title: Encrypt / decrypt text
    description: Encrypt clear text and decrypt ciphertext using crypto algorithms like AES, TripleDES, Rabbit or RC4.

  random-port-generator:
    title: Random port generator
    description: Generate random port numbers outside of the range of "known" ports (0-1023).

  yaml-prettify:
    title: YAML prettify and format
    description: Prettify your YAML string into a friendly, human-readable format.

  eta-calculator:
    title: ETA calculator
    description: An ETA (Estimated Time of Arrival) calculator to determine the approximate end time of a task, for example, the end time and duration of a file download.

  roman-numeral-converter:
    title: Roman numeral converter
    description: Convert Roman numerals to numbers and convert numbers to Roman numerals.

  hmac-generator:
    title: Hmac generator
    description: Computes a hash-based message authentication code (HMAC) using a secret key and your favorite hashing function.

  bip39-generator:
    title: BIP39 passphrase generator
    description: Generate a BIP39 passphrase from an existing or random mnemonic, or get the mnemonic from the passphrase.

  base64-file-converter:
    title: Base64 file converter
    description: Convert a string, file, or image into its base64 representation.

  list-converter:
    title: List converter
    description: This tool can process column-based data and apply various changes (transpose, add prefix and suffix, reverse list, sort list, lowercase values, truncate values) to each row.

  base64-string-converter:
    title: Base64 string encoder/decoder
    description: Simply encode and decode strings into their base64 representation.

  toml-to-yaml:
    title: TOML to YAML
    description: Parse and convert TOML to YAML.

  math-evaluator:
    title: Math evaluator
    description: A calculator for evaluating mathematical expressions. You can use functions like sqrt, cos, sin, abs, etc.

  json-to-yaml-converter:
    title: JSON to YAML converter
    description: Simply convert JSON to YAML with this online live converter.

  url-parser:
    title: URL parser
    description: Parse a URL into its separate constituent parts (protocol, origin, params, port, username-password, ...)

  iban-validator-and-parser:
    title: IBAN validator and parser
    description: Validate and parse IBAN numbers. Check if an IBAN is valid and get the country, BBAN, if it is a QR-IBAN and the IBAN friendly format.

  user-agent-parser:
    title: User-agent parser
    description: Detect and parse Browser, Engine, OS, CPU, and Device type/model from an user-agent string.

  numeronym-generator:
    title: Numeronym generator
    description: A numeronym is a word where a number is used to form an abbreviation. For example, "i18n" is a numeronym of "internationalization" where 18 stands for the number of letters between the first i and the last n in the word.

  case-converter:
    title: Case converter
    description: Transform the case of a string and choose between different formats

  html-entities:
    title: Escape HTML entities
    description: Escape or unescape HTML entities (replace characters like <,>, &, " and \' with their HTML version)

  json-prettify:
    title: JSON prettify and format
    description: Prettify your JSON string into a friendly, human-readable format.

  docker-run-to-docker-compose-converter:
    title: Docker run to Docker compose converter
    description: Transforms "docker run" commands into docker-compose files!

  mac-address-lookup:
    title: MAC address lookup
    description: Find the vendor and manufacturer of a device by its MAC address.

  mime-types:
    title: MIME types
    description: Convert MIME types to file extensions and vice-versa.

  toml-to-json:
    title: TOML to JSON
    description: Parse and convert TOML to JSON.

  lorem-ipsum-generator:
    title: Lorem ipsum generator
    description: Lorem ipsum is a placeholder text commonly used to demonstrate the visual form of a document or a typeface without relying on meaningful content

  qrcode-generator:
    title: QR Code generator
    description: Generate and download a QR code for a URL (or just plain text), and customize the background and foreground colors.

  wifi-qrcode-generator:
    title: WiFi QR Code generator
    description: Generate and download QR codes for quick connections to WiFi networks.

  xml-formatter:
    title: XML formatter
    description: Prettify your XML string into a friendly, human-readable format.

  temperature-converter:
    title: Temperature converter
    description: Degrees temperature conversions for Kelvin, Celsius, Fahrenheit, Rankine, Delisle, Newton, Réaumur, and Rømer.

  chmod-calculator:
    title: Chmod calculator
    description: Compute your chmod permissions and commands with this online chmod calculator.

  rsa-key-pair-generator:
    title: RSA key pair generator
    description: Generate a new random RSA private and public pem certificate key pair.

  html-wysiwyg-editor:
    title: HTML WYSIWYG editor
    description: Online, feature-rich WYSIWYG HTML editor which generates the source code of the content immediately.

  yaml-to-toml:
    title: YAML to TOML
    description: Parse and convert YAML to TOML.

  mac-address-generator:
    title: MAC address generator
    description: Enter the quantity and prefix. MAC addresses will be generated in your chosen case (uppercase or lowercase)

  json-diff:
    title: JSON diff
    description: Compare two JSON objects and get the differences between them.

  jwt-parser:
    title: JWT parser
    description: Parse and decode your JSON Web Token (jwt) and display its content.

  jwt-generator:
    title: JWT generator
    description: Generate a signed JSON Web Token (HS/RS/PS/ES) and verify its signature.

  date-converter:
    title: Date-time converter
    description: Convert date and time into the various different formats

  phone-parser-and-formatter:
    title: Phone parser and formatter
    description: Parse, validate and format phone numbers. Get information about the phone number, like the country code, type, etc.

  ipv4-subnet-calculator:
    title: IPv4 subnet calculator
    description: Parse your IPv4 CIDR blocks and get all the info you need about your subnet.

  og-meta-generator:
    title: Open graph meta generator
    description: Generate open-graph and socials HTML meta tags for your website.

  ipv6-ula-generator:
    title: IPv6 ULA generator
    description: Generate your own local, non-routable IP addresses for your network according to RFC4193.
  dns-record-generator:
    title: DNS record generator
    description: Build the TXT records behind email authentication — SPF, DKIM, DMARC and BIMI. Fill in the form, get the record name and value to paste into your DNS zone.

  hash-text:
    title: Hash text
    description: 'Hash a text string using the function you need : MD5, SHA1, SHA256, SHA224, SHA512, SHA384, SHA3, RIPEMD160, BLAKE2, BLAKE3, Keccak, xxHash, Adler-32, CRC-32, CRC-32C — or all of them at once'

  json-to-toml:
    title: JSON to TOML
    description: Parse and convert JSON to TOML.

  device-information:
    title: Device information
    description: Get information about your current device (screen size, pixel-ratio, user agent, ...)

  pdf-signature-checker:
    title: PDF signature checker
    description: Verify the signatures of a PDF file. A signed PDF file contains one or more signatures that may be used to determine whether the contents of the file have been altered since the file was signed.

  json-minify:
    title: JSON minify
    description: Minify and compress your JSON by removing unnecessary whitespace.

  ulid-generator:
    title: ULID generator
    description: Generate random Universally Unique Lexicographically Sortable Identifier (ULID).

  string-obfuscator:
    title: String obfuscator
    description: Obfuscate a string (like a secret, an IBAN, or a token) to make it shareable and identifiable without revealing its content.

  base-converter:
    title: Integer base converter
    description: Convert a number between different bases (decimal, hexadecimal, binary, octal, base64, ...)

  yaml-to-json-converter:
    title: YAML to JSON converter
    description: Simply convert YAML to JSON with this online live converter.

  uuid-generator:
    title: UUIDs generator
    description: A Universally Unique Identifier (UUID) is a 128-bit number used to identify information in computer systems. The number of possible UUIDs is 16^32, which is 2^128 or about 3.4x10^38 (which is a lot!).

  ipv4-address-converter:
    title: IPv4 address converter
    description: Convert an IP address into decimal, binary, hexadecimal, or even an IPv6 representation of it.

  text-statistics:
    title: Text statistics
    description: Get information about a text, the number of characters, the number of words, its size in bytes, ...

  text-to-nato-alphabet:
    title: Text to NATO alphabet
    description: Transform text into the NATO phonetic alphabet for oral transmission. Also supports the German (DIN 5008), French, Spanish and Russian spelling alphabets.

  jasypt:
    title: Jasypt string encryptor / decryptor
    description: 'Encrypt and decrypt the `ENC(...)` values that `jasypt-spring-boot` reads out of application.yml, without setting up a Java project. Supports PBEWithMD5AndDES (PBKDF1-MD5 + DES-CBC, the Spring Boot default) and PBEWITHHMACSHA512ANDAES_256 (PBKDF2-HMAC-SHA512 + AES-256-CBC). Iteration count and salt length are not encoded into the ciphertext, so both must match on decrypt; the defaults here are the same as Jasypt''s own.'
  htpasswd:
    title: htpasswd generator
    description: 'Generate and verify Apache .htpasswd lines without installing apache2-utils. Produces one `username:hash` line you can paste straight into a docker-compose environment variable. Supports bcrypt (the Apache default since 2.4.4), apr1 MD5 (the old default, still common on Windows and network shares), {SHA} and plaintext.'
  basic-auth-generator:
    title: Basic auth generator
    description: Generate a base64 basic auth header from a username and password.

  text-to-unicode:
    title: Text to Unicode
    description: Parse and convert text to unicode and vice-versa

  ipv4-range-expander:
    title: IPv4 range expander
    description: Given a start and an end IPv4 address, this tool calculates a valid IPv4 subnet along with its CIDR notation.

  text-diff:
    title: Text diff
    description: Compare two texts and see the differences between them.

  otp-generator:
    title: OTP code generator
    description: Generate and validate time-based and event-based OTP (one time password) for multi-factor authentication.

  url-encoder:
    title: Encode/decode URL-formatted strings
    description: Encode text to URL-encoded format (also known as "percent-encoded"), or decode from it.

  text-to-binary:
    title: Text to UTF-8 binary
    description: Convert text to its UTF-8 binary representation and vice-versa.

  ssl-certificate-decoder:
    title: SSL certificate decoder
    description: Decode an X.509 certificate and show its subject, issuer, validity window, public key, SAN entries and fingerprints. Accepts PEM, base64 or DER hexadecimal — a whole certificate chain can be pasted at once.
  iana-timezone-index:
    title: IANA timezone index
    description: Searchable index of the IANA timezone database. Look up a zone by name, by its abbreviation (CST) or by UTC offset (UTC+8), and see the current offset, the standard offset, whether daylight saving time is in effect and the local time right now.

  color-contrast-checker:
    title: Color contrast checker
    description: Check the contrast ratio of two colors against the WCAG 2.1 AA and AAA text and UI component thresholds.

  commit-memo:
    title: Conventional Commit Cheatsheet
    description: Conventional commits cheatsheet with examples and common tools

  common-regex-memo:
    title: Common Regex Cheatsheet
    description: Cheatsheet for common regex patterns

  csv-to-json:
    title: CSV to JSON
    description: Convert CSV to JSON with RFC 4180 quoted fields, custom delimiters, optional headers and type inference.

  html-to-markdown:
    title: HTML to Markdown
    description: Convert HTML to Markdown. Handles headings, links, lists, quotes, code blocks and images, plus GFM tables, strikethrough and task lists.

  json-to-go:
    title: JSON to Go
    description: Convert JSON into Go type definitions (structs).

  markdown-cheatsheet:
    title: Markdown Cheat Sheet
    description: Markdown Cheat Sheet

  markdown-table-generator:
    title: Markdown Table Generator
    description: 'Build a GitHub-flavored Markdown table in a visual editor: add or remove rows and columns, set the alignment of each column, and copy the result.'

  morse-code:
    title: Morse Code Converter
    description: Encode text into Morse code and decode Morse code back into text.

  nano-memo:
    title: Nano CheatSheet
    description: Nano Editor Cheatsheet

  punycode-converter:
    title: Punycode converter
    description: Convert internationalized domain names or email addresses to and from ASCII Punycode (RFC 3492).

  chinese-number-converter:
    title: Chinese number converter
    description: Convert between Chinese numerals and Arabic numerals. Supports uppercase financial numerals (壹贰叁), plain numerals, RMB amounts and traditional character variants.

  csr-generator:
    title: CSR generator
    description: Generate a certificate signing request (CSR) and its key pair, with support for multiple domains and IP addresses in the SAN.

  css-js-formatter:
    title: CSS and JavaScript formatter
    description: Format and beautify CSS or JavaScript code. Choose the indent size, tab or space indentation, and line ending.

  data-size-converter:
    title: Data size converter
    description: Convert data sizes between bytes, kilobytes, megabytes, gigabytes, terabytes and petabytes, with switchable decimal (SI) and binary (IEC) base.

  exif-reader:
    title: EXIF reader
    description: 'Read the EXIF metadata of an image: camera make and model, date taken, exposure settings and GPS coordinates.'

  har-sanitizer:
    title: HAR sanitizer
    description: Remove tokens, cookies and other sensitive data from a HAR file before sharing it.

  ipv6-address-converter:
    title: IPv6 address converter
    description: Convert an IPv6 address into its expanded, compressed, decimal, hexadecimal and binary forms, plus the ARPA reverse name and the address type.

  ipv6-subnet-calculator:
    title: IPv6 subnet calculator
    description: Compute the network address, first and last host, address count, netmask and wildcard mask of an IPv6 CIDR block, and split it into smaller subnets.

  ssh-key-pair-generator:
    title: SSH key pair generator
    description: Generate an SSH key pair in OpenSSH format (ed25519, ECDSA P-256 or RSA), with an optional passphrase and the matching authorized_keys line and SHA256 fingerprint.

  unit-converter:
    title: Unit converter
    description: Convert values between units of length, mass, area, volume, time, speed, angle, pressure, energy, power, force and data size.

  week-number-converter:
    title: Week number converter
    description: Convert between dates, ISO week numbers and week-of-month. Week starts on Monday; week 1 of a month is the week that contains the 1st.

  x509-certificate-generator:
    title: X.509 certificate generator
    description: Generate a self-signed X.509 certificate and its private key, with multiple domains and IP addresses in the SAN.

  xml-diff:
    title: XML diff
    description: Compare two XML documents and highlight the differences.

  dns-query:
    title: DNS record lookup
    description: Query A, AAAA, CNAME, MX, TXT, NS, SOA, SRV, PTR and CAA records for a domain name.

  date-calculator:
    title: Date calculator
    description: Add or subtract days, find the difference between two dates, and compute an age — all on the calendar day, so daylight saving never shifts a result.

  docker-compose-validator:
    title: Docker Compose validator
    description: Validate a docker-compose.yml file and list its syntax errors and semantic problems with their location and a suggested fix.

  ical-generator:
    title: iCal generator
    description: Build an RFC 5545 .ics calendar event, with times in UTC and no VTIMEZONE needed.

  ical-parser:
    title: iCal parser
    description: Parse an .ics file into a readable table of events, with folded lines unfolded and text unescaped.

  icon-generator:
    title: Icon generator
    description: Generate app icon sets, a PWA manifest and a ZIP archive from one image.

  integer-to-ip:
    title: Integer to IP
    description: Convert an integer to an IPv4 address, an RFC 5952 IPv6 address, hexadecimal and binary.

  json-to-csharp:
    title: JSON to C#
    description: Convert JSON into C# type definitions (classes or records).

  object-id:
    title: MongoDB ObjectId
    description: Generate MongoDB ObjectIds and inspect their structure (timestamp, random value, counter). The date-time-converter tool already converts dates to and from the mongo-objectid format in both directions, so this one covers generation and structural breakdown instead.

  stacktrace-formatter:
    title: Stack trace formatter
    description: Parse a stack trace (V8, Firefox, Java, Python, .NET) into frames, and copy it as aligned text or highlighted HTML.

  uuid-parser:
    title: UUID parser
    description: Parse UUIDs and show their version, variant, timestamp, clock sequence, node identifier and Microsoft GUID form.

  exif-remover:
    title: Remove image metadata
    description: List the metadata segments inside a JPEG, PNG or WebP and remove the ones you pick — the image data itself is copied byte for byte, never re-encoded.

  markdown-table-formatter:
    title: Markdown Table Formatter
    description: 'Align the columns of a Markdown table: every column is padded to its widest cell, the separator row is rebuilt to match, and the alignment markers are kept.'
