[package]
name = "it-tools"
version = "0.0.2"
edition = "2021"
# rcgen 0.14 要求 1.88（它是自签 X.509 / CSR 的主力 crate）。
rust-version = "1.88"
description = "IT Tools — 开发者工具箱的 Rust 实现（actix-web + tera + rust-embed）"
license = "GPL-3.0-only"
readme = "README.md"
build = "build.rs"

[dependencies]
# Web 框架 / 模板 / 资源嵌入
actix-web = "4"
# 模板引擎。tera 2 是一次**从零重写**，不是 1.x 的小版本升级，换了几处用法：
# 宏（`{% macro %}` / `{% import %}`）整个没了，改成组件（`{% component %}`，
# 调用写成 `{{<name />}}`）；组件是**全局**的，定义好就能用，不必 import。
# 要额外依赖的内置过滤器（json_encode 等）搬去了 tera-contrib，我们只用到
# json_encode 一个，自己在 src/templates.rs 里注册即可，不必多引一个 crate。
#
# `preserve_order`：Map 不开这个特性就是 HashMap，键的迭代顺序每个进程都不一样 ——
# 命令面板那段 JSON 是 `base.nav.search | json_encode` 出来的，顺序会跟着变，
# 同一份页面两次渲染出来的字节不一样。开这个特性后是 IndexMap，顺序按插入顺序，
# 稳定可复现（indexmap 本来就在依赖树里，不多编译什么）。
tera = { version = "2.4.0", default-features = false, features = ["preserve_order"] }
rust-embed = "8"
mime_guess = "2"

# 序列化 / 配置 / CLI / 错误 / 日志
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
# `ImplKind::Static` 的速查表内容是 Markdown，渲染成 HTML 后再塞进模板。
# 原始 HTML 一律当文本转义（跟 markdown-to-html 工具的口径一致）——
# 内容是我们自己仓库里的文件，不该有能注入的标签。
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
thiserror = "2"
once_cell = "1"
log = "0.4"
env_logger = "0.11"

# S1: hash-text 工具所需的摘要算法
#
# 这一组**整体**是 digest 0.11 一代：rsa 0.10 要的是 digest 0.11 的 `Digest`
# trait，sha2 0.11 / md-5 0.11 / sha1 0.11 / sha3 0.12 / ripemd 0.2 跟它对齐，
# hmac 0.13 也是同一代（`Hmac<Sha256>` 要求 sha2 也是 0.11）。
#
# 为什么必须六家一起动：本仓库里这几种摘要是**捆在一起用**的 ——
# hmac_generator 要给九种算法算 HMAC，hash-text 要把九种摘要并排列出来。
# 只要有一家停在 digest 0.10，同一个文件里就得并排挂两代 `Digest` trait
# （名字还撞，只能匿名 import，方法解析也就此多一层心照不宣）。
# 现在六家一起到 0.11，**digest 0.10 从依赖树里整个消失**。
md-5 = "0.11"
sha1 = "0.11"
# sha2 的 "oid" 特性给出各摘要算法的 OID（AssociatedOid）—— rsa 0.10 的
# PKCS#1 v1.5 签名要靠它才知道该往摘要前面拼哪段 DER 前缀。
sha2 = { version = "0.11", features = ["oid"] }
sha3 = "0.12"
ripemd = "0.2"
# hash-text 补算法（上游 PR #986）：blake 系列、xx 系列、校验和那一类。
# 全部是**一次性**摘要算法，无盐无参数 —— 跟 pbkdf2 / argon2 那种
# 「同一段文本每次结果都不同」的性质不同，所以可以放进 hash-text 的下拉框。
blake2 = "0.11"
blake3 = "1.8"
twox-hash = "2.1"
adler32 = "1.2"
crc32fast = "1.5"
crc32c = "0.6"
hex = "0.4"
actix-multipart = "0.8.5"
base64 = "0.23.1"
bcrypt = "0.19.3"
argon2 = "0.6"
rsa = "0.10.0-rc.19"
pem = "4.0.0"
# 随机数只有 rand 0.10 一套：它底下是 rand_core 0.10，而 rsa 0.10、ed25519-dalek 3
# 要的 `CryptoRng` 也正是 rand_core 0.10 那一版 —— 同一个 trait，不需要桥接，
# 也不必再单独引一个 rand_core。`rand::rng()`（ThreadRng）满足这个 trait，
# 喂给 `RsaPrivateKey::new` / `try_sign_with_rng` / `SigningKey::generate` 都行。
rand = "0.10"
# OpenSSH 私钥加密：bcrypt-pbkdf 派生密钥 + AES-256-CTR 加密（openssh-key-v1 格式）
bcrypt-pbkdf = "0.11"
# 0.46 才有 `LoadOptions::max_decompressed_size` —— PDF 签名检查器靠它挡住解压炸弹
# （对象流 / xref 流是加载时急切解压的，几十 KB 的文件能撑爆内存）。
lopdf = "0.46.0"
x509-certificate = "0.25.0"
# `verify` 特性给出 `X509Certificate::verify_signature` —— 自签证书的签名
# 到底能不能验过，只有真验一遍才知道（x509-certificate-generator 的单测靠它）。
# 它依赖的 `ring` 本来就在依赖树里（rcgen 用），不会多编译什么。
x509-parser = { version = "0.18.1", features = ["verify"] }
totp-rs = "6.0.0"
chrono = "0.4.45"
chrono-tz = "0.10.4"
hmac = "0.13"
# JWT 签名/验签（上游 PR #1453）的三条 ECDSA 曲线。
# 这三个 crate 各自带一份 ecdsa 实现（0.14 系列的 elliptic-curve → ecdsa 0.17，
# 走的正是 digest 0.11 / signature 3，跟上面那组摘要和 rsa 0.10 是同一代）。
# 摘要类型由曲线自己定（P-256→SHA-256、P-384→SHA-384、P-521→SHA-512），
# 所以不必把 ecdsa / sha2 单独引进来。
p256 = "0.14"
p384 = "0.14"
p521 = "0.14"
elliptic-curve = "0.14"
data-encoding = "2.11.1"
aes-gcm = "0.11.1"
aes = "0.9.2"
cbc = "0.2.1"
des = "0.9.0"
rc4 = "0.2.0"
rabbit = "0.5.0"
futures-util = "0.3.34"
# DNS 查询（上游 PR #1811 的 dns-query）：hickory 是 trust-dns 的后继，
# 纯 UDP/TCP 查询，不需要 TLS 栈 —— 我们的部署目标是内网，
# 上游那套 DoH + RDAP 要引入整套 HTTP/TLS 依赖，代价与收益不成比例。
hickory-resolver = { version = "0.26", default-features = false, features = ["system-config", "tokio"] }
# IPv6 子网计算：ipnet 负责前缀与网络，num-bigint 负责 128 位主机位算术
# （2^128 这类值放不进 u64，但放得进 u128 —— 只有 2^64 以上才需要 BigInt，
#  实际用 BigInt 是因为「总地址数」要写成十进制字符串，u128 的十进制转换够用，
#  但掩码与首末地址的中间运算在 u128 里做更直观）。
ipnet = "2.12"
num-bigint = "0.5"
# OpenSSH 私钥（openssh-key-v1 容器）要 ed25519 的**种子**（32 字节），
# rcgen 不暴露 ed25519 私钥种子，所以自己用 ed25519-dalek 生成。
ed25519-dalek = "3.0"
# 自签 X.509 证书与 CSR 生成（上游 PR #915 / #1812 / #910）
rcgen = "0.14.10"
# rcgen 用的是 `time::OffsetDateTime` 表示有效期，但 rcgen 把它设成了
# `default-features = false`，我们这边要自己用就得显式声明一份。
# `formatting` 是为了把有效期按 RFC 3339 输出（默认特性里只有 std）。
time = { version = "0.3", features = ["formatting"] }

# 库 target：实现都在这里，可执行文件只是入口。
# 有 lib target 才能写集成测试（`tests/` 下的测试要用 actix_web::test
# 把整个 App 组装起来打请求）。
[lib]
name = "it_tools"
path = "src/lib.rs"

[dev-dependencies]
# 集成测试要写「给这个服务发一个请求」的辅助函数，
# 而 actix_web::test::call_service 的服务类型里带着 actix_http::Request ——
# actix-http 只是 actix-web 的传递依赖，不直接依赖它就写不出那个签名。
actix-http = "3"

[features]
default = []
# 开发期让 rust-embed 从磁盘读取 static/ 与 templates/，改完刷新即可见
debug-embed = ["rust-embed/debug-embed"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[[bin]]
name = "it-tools"
path = "src/main.rs"
